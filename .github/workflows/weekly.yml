name: Weekly

on:
  schedule:
    - cron: "23 5 * * 6"
  workflow_dispatch:
  # Work branches named ci/** run the full workflow on push (and any branch
  # on manual dispatch) so GitHub's own runners test a branch before main.
  push:
    branches: ["ci/**"]

# Default-deny token scope (grind r3, R61/b2:D1): every job in this
# workflow only reads the repo, so the GITHUB_TOKEN gets exactly that.
permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  extended-tests:
    name: Slow and rare tests
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No uv.lock: key the uv cache on the dependency declarations.
          cache-dependency-glob: "pyproject.toml"

      - name: Install graphviz and cairo
        # libcairo2 is cairosvg's native half; without it the pixel layers
        # of the SVG golden families import-fail (r7 R79).
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libcairo2

      - name: Install torch and TorchLens
        run: |
          # torch AND torchvision are pinned as a +cpu pair and resolved in ONE
          # install against the CPU index plus PyPI: the former two-step install
          # (torch from the CPU index, then the extras from PyPI only) pulled
          # PyPI's CUDA torchvision build, whose compiled ops do not load
          # against the CPU torch (lightning -> torchmetrics -> torchvision
          # import failures in the bridge gate).
          cat > "${{ runner.temp }}/torch-2.7-constraints.txt" <<'EOF'
          torch==2.7.1+cpu
          torchvision==0.22.1+cpu
          EOF
          # --index-strategy unsafe-best-match rationale (R61, reviewed): both indexes are reputable and the torch pins are exact `==X+cpu` local versions only the torch index serves, so cross-index confusion cannot select a different name/version; first-index would break resolving torch's +cpu artifacts alongside PyPI deps.
          uv pip install --system -c "${{ runner.temp }}/torch-2.7-constraints.txt" \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,test,tabular]" \
            "torch==2.7.1+cpu" \
            "torchvision==0.22.1+cpu"
          uv pip check
          python - <<'PY'
          import torch
          import torchvision
          from torchvision.ops import nms

          assert torch.__version__ == "2.7.1+cpu", torch.__version__
          assert torchvision.__version__ == "0.22.1+cpu", torchvision.__version__
          assert nms(torch.tensor([[0.0, 0.0, 1.0, 1.0]]), torch.tensor([1.0]), 0.5).tolist() == [0]
          print(torch.__version__, torchvision.__version__)
          PY

      - name: Install bridge adapters and cairosvg
        # r7 R79 (fable MED, wave-introduced): this gate's comment claimed
        # the dark families "STOP skipping here" while the job installed
        # NONE of their dependencies -- captum, sae-lens (x2), rsatoolbox,
        # and the whole cairosvg module still skipped behind a green
        # aggregate floor of 5. The gate now installs exactly the deps whose
        # families it names.
        run: |
          uv pip install --system -c "${{ runner.temp }}/torch-2.7-constraints.txt" \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            captum sae-lens rsatoolbox cairosvg
          uv pip check
          python -c 'import lightning, timm, torchvision.ops; print("bridge env imports OK")'

      - name: Bridge adapters and cairosvg collision gate (executed floor)
        # The whole point is that these STOP skipping here. Floors are
        # PER FILE and exact (11 bridge tests, 4 label-geometry tests,
        # counted 2026-08-16): the old aggregate floor of 5 stayed green
        # with every named family skipped (r7 R79).
        run: |
          pytest tests/test_bridges_launch.py \
            --junitxml="${{ runner.temp }}/bridge.junit.xml" --tb=short -q
          pytest tests/test_label_geometry.py \
            --junitxml="${{ runner.temp }}/labelgeom.junit.xml" --tb=short -q
          python scripts/check_ci_executed_tests.py "${{ runner.temp }}/bridge.junit.xml" 11
          python scripts/check_ci_executed_tests.py "${{ runner.temp }}/labelgeom.junit.xml" 4

      - name: Run slow tests
        # `not rare`: a command-line -m replaces pyproject's `-m 'not rare'`, so a
        # bare `-m slow` also ran every rare+slow test (the 20k-50k node graphs)
        # here and again in the rare step.
        #
        # One pytest process per file, batched within a large file (not one
        # process for the whole tier): a single long-lived process running
        # every slow test accumulates memory across the whole run, and the
        # runner was killed by the host partway through
        # tests/test_real_world_models.py on three consecutive runs
        # (2026-10-03). A fresh interpreter per file still wasn't enough --
        # that one file alone (dozens of full-size torchvision models) got
        # the runner killed again 23% into its own process (round 2, same
        # day) -- so a file bigger than --max-batch-size is additionally
        # split into fixed-size batches of test ids, each its own process.
        # tests/test_real_world_models.py runs one test per process: its
        # full-size models peak at up to 8.7 GB RSS each (efficientnet_b6),
        # and two in one process reached 11.2 GB, so even a 20-test batch
        # got the 16 GB runner shut down (2026-10-03).
        # Every unit's junit report is merged into one file so the
        # executed-test floor check below is unchanged (adjusted for the
        # big_memory exclusion). Known real-world-model validation failures
        # are tracked in tests/known_failures.py as strict xfail -- this step
        # still runs and fails them honestly; it is not a skip.
        #
        # `and not big_memory`: a handful of real-model tests are excluded
        # here even though they are NOT capture bugs -- their peak RSS (alone,
        # or stacked with whatever else the host's allocator hadn't freed yet)
        # is simply bigger than this runner's 16 GB, independent of
        # per-file/per-test batching (FJ-weekly-green). They run instead on a
        # large-memory fleet machine on their own schedule; see
        # docs: big_memory marker in pyproject.toml / marker_algebra.py.
        run: |
          # Resource trace: when the host shuts the runner down mid-step, the last
          # lines show memory and disk headroom just before it happened.
          ( while true; do echo "[resources $(date -u +%H:%M:%S)] mem: $(free -m | awk '/^Mem:/{print $3 " used / " $7 " available MB"}') disk: $(df -h / | awk 'NR==2{print $4 " free"}')"; sleep 60; done ) &
          python scripts/run_pytest_per_file_sharded.py tests/ \
            --marker "slow and not rare and not big_memory" \
            --junit-dir "${{ runner.temp }}/weekly-slow-per-file" \
            --combined-junit "${{ runner.temp }}/weekly-slow.junit.xml" \
            --max-batch-size 20 \
            --file-batch-size tests/test_real_world_models.py=1

      - name: Run rare tests
        # The small-capture perf gate compares millisecond trace floors against
        # a baseline recorded on one box (32 cores, torch 2.7.1); its context
        # guard fails on any other box by design ("baseline nproc=32 but this
        # box has 4"), so on this 4-core runner it can only ever be red. It runs
        # on the baseline box instead; the fast-tier floor (an absolute ratio)
        # stays here. big_memory tests run on the large-memory fleet machine.
        run: |
          pytest tests/ -m "rare and not big_memory" --tb=short \
            --deselect tests/test_perf_capture_ab.py::test_small_capture_overhead_within_gate \
            --junitxml="${{ runner.temp }}/weekly-rare.junit.xml"

      - name: Fail on an under-executed slow or rare tier
        # Executed-floor attestation for the ONLY leg that ever runs these
        # tiers (grind r3, R82): a marker drift or importorskip cascade that
        # hollows them out must go red, not green. Floors are roughly half
        # the current selections (295 slow / 16 rare, counted 2026-08-15;
        # unchanged by the 14-test big_memory exclusion above -- the floor
        # already has ~140 tests of headroom).
        run: |
          python scripts/check_ci_executed_tests.py "${{ runner.temp }}/weekly-slow.junit.xml" 145
          python scripts/check_ci_executed_tests.py "${{ runner.temp }}/weekly-rare.junit.xml" 8

  mutation-margin:
    # The mutation driver's zero-survivor criterion is R74's grind-level
    # convergence condition, but the driver was "wired into no CI leg — the
    # margin is measured only when invoked" (b9 round 5, S HIGH + F MED):
    # survivor discovery happened only when someone remembered. This job
    # scores the registry, checks, corechecks, blocks, and exempt families
    # weekly and FAILS on any survivor or scoring error (the driver exits 1).
    # The ~161-mutant per-arm campaign runs as mutation.yml's rotating weekly
    # shard (one arm shard per week; a full sweep is a multi-hour run), and
    # its zero-survivor log is a required convergence artifact, not a weekly
    # gate here.
    name: mutation margin (${{ matrix.family }})
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        family: [registry, checks, corechecks, blocks, exempt, executor]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No uv.lock: key the uv cache on the dependency declarations.
          cache-dependency-glob: "pyproject.toml"

      - name: Install graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install canonical CPU test environment
        run: |
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,test,tabular]" \
            "torch==2.8.0+cpu" \
            "torchvision==0.23.0+cpu"
          uv pip check

      - name: Score the ${{ matrix.family }} mutant family
        run: |
          set -o pipefail
          python tests/support/mutation_driver.py \
            --make-sandbox "${{ runner.temp }}/mut" \
            --family "${{ matrix.family }}" \
            | tee "${{ runner.temp }}/mutation-${{ matrix.family }}.log"

      - name: Upload the campaign log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-${{ matrix.family }}
          path: ${{ runner.temp }}/mutation-${{ matrix.family }}.log

  hook-pin-staleness:
    # r7 R61 (opus LM + sol MED, converged): the pre-commit hook SHAs are
    # correctly frozen but had NO refresh signal -- Dependabot has no
    # pre-commit ecosystem, so gitleaks/detect-secrets could sit on an old
    # security release indefinitely while dependabot.yml's header claimed
    # every frozen pin was covered. This job is that signal: it runs
    # `pre-commit autoupdate` on a scratch copy and surfaces the diff in the
    # job summary + a warning annotation. ADVISORY by design (exit 0): pins
    # move on review, and a red that fires on every routine upstream release
    # would train everyone to ignore the job (the permanent-WARN disease).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No uv.lock: key the uv cache on the dependency declarations.
          cache-dependency-glob: "pyproject.toml"

      - run: uv pip install --system "pre-commit==4.6.2"

      - name: Report stale pre-commit hook pins
        run: |
          cp .pre-commit-config.yaml "${RUNNER_TEMP}/pre-commit-before.yaml"
          pre-commit autoupdate --freeze
          if git diff --quiet -- .pre-commit-config.yaml; then
            echo "All pre-commit hook pins are current." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Stale pre-commit hook pins::pre-commit autoupdate proposes newer hook revisions; review and bump the frozen SHAs (keep ruff-pre-commit locked to the repo ruff pin)."
            {
              echo "## Stale pre-commit hook pins"
              echo '```diff'
              git diff -- .pre-commit-config.yaml
              echo '```'
              echo "ruff-pre-commit is DELIBERATELY locked to the repo's ruff pin;"
              echo "ignore its row unless the pyproject/lint.yml pins move too."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          git checkout -- .pre-commit-config.yaml

  optimized-verdict-identity:
    # r7 R24 (sol MED, 4th pass): 97 shipped asserts remain behind the
    # shrink-only S101 ceiling, validation strips assertion checks under
    # python -O (validation/backward.py), and NO leg proved the verdict
    # surface survives optimized mode -- a load-bearing assert converts a
    # FAIL verdict into silent green exactly where users run -O. This leg
    # executes the verdict-adjacent suites (the planted-corruption corpus
    # asserts FAIL verdicts, so an -O-stripped tripwire goes RED here) under
    # python -O. Measured locally: 368 passed in 2m27s.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No uv.lock: key the uv cache on the dependency declarations.
          cache-dependency-glob: "pyproject.toml"

      - name: Install graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install canonical CPU test environment
        run: |
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,test,tabular]" \
            "torch==2.8.0+cpu" \
            "torchvision==0.23.0+cpu"
          uv pip check

      - name: Verdict identity under python -O
        # requires_assertions-marked tests self-skip under -O (their whole
        # point is needing `assert`); everything else must reach identical
        # verdicts with assertions stripped.
        run: |
          python -O -c "assert True or False; print('assertions stripped:', not __debug__)"
          python -O -m pytest tests/test_validation.py tests/validation_goldens/ \
            -q --tb=short -p no:randomly

  netron-latest-drift:
    # F14 (netron memo D-08; packaging_requests 2026-08-28, landed by D05):
    # the vendor-parser suite against UNPINNED-latest netron. Drift here
    # NEVER moves the floor -- the nightly leg pins 9.2.2 exact; this job is
    # continue-on-error and reports the installed version in the job summary
    # so a refresh of the pin is an intentional, reviewed change.
    name: Netron unpinned-latest drift canary
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No uv.lock: key the uv cache on the dependency declarations.
          cache-dependency-glob: "pyproject.toml"

      - name: Install torch and TorchLens
        run: |
          # Same +cpu torch/torchvision pair recipe as extended-tests above.
          cat > "${{ runner.temp }}/torch-2.7-constraints.txt" <<'EOF2'
          torch==2.7.1+cpu
          torchvision==0.22.1+cpu
          EOF2
          # --index-strategy unsafe-best-match rationale (R61, reviewed): both indexes are reputable and the torch pins are exact `==X+cpu` local versions only the torch index serves, so cross-index confusion cannot select a different name/version; first-index would break resolving torch's +cpu artifacts alongside PyPI deps.
          uv pip install --system -c "${{ runner.temp }}/torch-2.7-constraints.txt" \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,test,tabular]" netron \
            "torch==2.7.1+cpu" \
            "torchvision==0.22.1+cpu"
          uv pip check
          python -c 'import torch, torchvision.ops; assert torch.__version__ == "2.7.1+cpu", torch.__version__; print(torch.__version__)'

      - name: Vendor-parser suite against latest netron (drift canary)
        continue-on-error: true
        run: |
          version="$(python -c 'import netron; print(netron.__version__)')"
          echo "## Netron drift canary: installed netron $version (nightly pin 9.2.2)" >> "$GITHUB_STEP_SUMMARY"
          pytest tests/test_netron_export_vendor.py tests/test_netron_export_serve.py \
            -p no:randomly --tb=short -q --junitxml="${{ runner.temp }}/netron-latest.junit.xml"
          python scripts/check_ci_executed_tests.py "${{ runner.temp }}/netron-latest.junit.xml" 0 --min-passed 6
