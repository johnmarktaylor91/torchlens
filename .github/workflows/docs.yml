name: Docs

# Build the documentation site strictly and check its links. Runs on pull
# requests and on manual dispatch only: never on pushes to work branches.
# There is no deploy job here; api-map.yml builds the same site and deploys
# it to GitHub Pages after each release.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.head_ref || github.ref }}-docs"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: "requirements-docs.lock"

      # Every package pinned with its hash; regenerate the lock from
      # requirements-docs.txt (the command is in that file's header).
      - name: Install the docs toolchain
        run: uv pip install --system --require-hashes -r requirements-docs.lock

      - name: Agent index and llms.txt match the task cards
        run: python tools/docs/build_agent_index.py --check

      - name: Site navigation matches the site map
        run: python tools/docs/site_nav.py --check

      - name: Strict build
        run: zensical build --strict --clean

      - name: Internal links and anchors
        run: python tools/docs/check_site_links.py site --base-path /torchlens/
