  model-explorer-contract:
    # F15 (modelexplorer memo B11; packaging_requests 2026-08-28, landed by
    # D05 as the scheduled tier): the vendor contract executes against the
    # pinned ai-edge-model-explorer 0.1.32 (installed --no-deps: its server
    # stack is not the contract; the dataclasses + worker are) with node >= 20
    # for the worker oracle. EXACT executed-count expectation: every row in
    # both files executes and NONE skips (skip fraction 0.0) -- the
    # importorskip defect the request names. The drift step compares the
    # PyPI and npm latest against the pins and reports in the job summary
    # (this workflow has no issues:write; drift never moves a release gate).
    name: Model Explorer vendor contract (pinned 0.1.32)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No uv.lock: key the uv cache on the dependency declarations.
          cache-dependency-glob: "pyproject.toml"

      - name: Install the test environment + pinned Model Explorer (no deps)
        run: |
          # --index-strategy unsafe-best-match rationale (R61, reviewed): both indexes are reputable and the torch pins are exact `==X+cpu` local versions only the torch index serves, so cross-index confusion cannot select a different name/version; first-index would break resolving torch's +cpu artifacts alongside PyPI deps.
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,test,tabular]" \
            "torch==2.13.0+cpu" \
            "torchvision==0.28.0+cpu"
          uv pip install --system --no-deps "ai-edge-model-explorer==0.1.32"
          node --version
          python -c 'import model_explorer; print("model_explorer imported")'

      - name: Vendor contract + real-model rows (exact executed count, zero skips)
        run: |
          pytest tests/test_modelexplorer_contract.py tests/test_modelexplorer_real.py \
            -p no:randomly --tb=short -q --junitxml="${{ runner.temp }}/me.junit.xml"
          python scripts/check_ci_executed_tests.py "${{ runner.temp }}/me.junit.xml" 15 0.0

      - name: Vendor drift canary (PyPI + npm latest vs the pins; summary only)
        continue-on-error: true
        run: |
          pypi_latest="$(curl -sSf https://pypi.org/pypi/ai-edge-model-explorer/json | python -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])')"
          npm_latest="$(npm view ai-edge-model-explorer-visualizer version)"
          {
            echo "## Model Explorer vendor drift"
            echo "- PyPI ai-edge-model-explorer: pinned 0.1.32, latest $pypi_latest"
            echo "- npm ai-edge-model-explorer-visualizer: pinned 0.1.2, latest $npm_latest"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$pypi_latest" != "0.1.32" ] || [ "$npm_latest" != "0.1.2" ]; then
            echo "vendor drift detected (see summary): open an intentional contract-profile update, never move a release gate"
            exit 1
          fi
