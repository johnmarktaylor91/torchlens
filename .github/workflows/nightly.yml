  dep-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No uv.lock: key the uv cache on the dependency declarations.
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        # pip>=26.1 and setuptools>=83 are installed EXPLICITLY so both
        # previously suppressed advisories are FIXED in the audited
        # environment instead of ignored (grind r3, R61/b2:B5):
        #   * CVE-2026-3219 (pip < 26.1: concatenated zip/tar confusion) --
        #     the runner-image pip is upgraded to the fixed release.
        #   * PYSEC-2026-3447 (setuptools < 83: MANIFEST.in exclude Unicode-
        #     normalization bypass packs NFD-named files into sdists) -- this
        #     targets exactly this project's MANIFEST-governed sdist path, so
        #     it was never a justifiable suppression; the build-system floor
        #     in pyproject.toml is raised to match.
        run: |
          # --index-strategy unsafe-best-match rationale (R61, reviewed): both indexes are reputable and the torch pins are exact `==X+cpu` local versions only the torch index serves, so cross-index confusion cannot select a different name/version; first-index would break resolving torch's +cpu artifacts alongside PyPI deps.
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e . \
            "torch==2.13.0+cpu" \
            "pip-audit==2.10.1" \
            "pip>=26.1" \
            "setuptools>=83"
          uv pip check
          python -c 'import torch; assert torch.__version__ == "2.13.0+cpu"; print(torch.__version__)'

      - name: Run pip-audit
        # NO suppressions: both former --ignore-vuln entries are resolved by
        # installing the fixed releases above. A new advisory must be FIXED or
        # get a justified, expiring suppression reviewed by the owner -- never
        # an inherited unexplained ignore.
        run: pip-audit

      - name: Audit the release lock (token-bearing path)
        # R61 (b2-opus): the hash-locked stack that runs with the repo-write
        # App token was outside the only vulnerability gate -- a CVE in
        # requests/urllib3/jinja2 inside the release env was invisible to CI.
        # release-requirements.txt is the SINGLE pin authority: build_command
        # installs nothing inside the token scope.
        run: |
          pip-audit -r .github/workflows/release-requirements.txt --disable-pip

  dep-audit-extras:
    # The core job above audits only `-e .` — nothing audited the dev/test/
    # tabular trees that actually pull transformers, timm, lightning,
    # sentence-transformers, etc., so the job's verdict was narrower than
    # "Dependency audit" implies (grind r5, b10 R83-2). Same pins, same
    # no-suppression policy, extras tree.
    name: Dependency audit (extras)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No uv.lock: key the uv cache on the dependency declarations.
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies with test extras
        run: |
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,test,tabular]" \
            "torch==2.13.0+cpu" \
            "pip-audit==2.10.1" \
            "pip>=26.1" \
            "setuptools>=83"
          uv pip check

      - name: Run pip-audit over the extras tree
        # NARROW, DATED WAIVER (2026-08-19). PYSEC-2026-3624 / CVE-2026-58659:
        # RCE in PyTorch Lightning's `_load_state`, where a crafted checkpoint
        # bypasses weights_only=True and executes attacker-named modules from
        # `_instantiator` hyperparameters when LightningModule.load_from_checkpoint
        # is called.
        #
        # Why waived rather than fixed: it affects lightning through 2.6.5 and is
        # fixed upstream only in commit d710d68 -- NO RELEASE CONTAINS THE FIX
        # (2.6.5 is the newest published version), so there is nothing to upgrade
        # to. Exposure here is nil on two independent counts: `lightning` is an
        # OPTIONAL extra and is NOT a runtime dependency (runtime deps are numpy,
        # packaging, torch, safetensors, tqdm, graphviz, typing_extensions,
        # pillow), so `pip install torchlens` never pulls it; and torchlens has
        # ZERO call sites for `load_from_checkpoint` in the package or the test
        # suite, so the vulnerable path is never entered.
        #
        # Scoped to THIS extras job on purpose: the core `Dependency audit` job
        # stays strict with no ignores, so a vulnerability in an actual runtime
        # dependency still blocks the release.
        #
        # REVIEW TRIGGER: drop this flag the moment a lightning release ships
        # d710d68 (check `pip index versions lightning` > 2.6.5), and re-check at
        # the next release cycle regardless. Do NOT broaden it to another ID
        # without the same exposure analysis written out.
        #
        # --- transformers: the four 4.x-band waivers are RETIRED (2026-08) ---
        # The in-repo transformers band widened to >=4.45,<6 (megaplan FORK-2,
        # lane A12), so this job's fresh `.[dev,test,tabular]` resolve now
        # installs transformers 5.x, where all four formerly-waived advisories
        # (PYSEC-2025-217, PYSEC-2026-2288/2289/2290 -- RCE from loading an
        # untrusted model artifact) are fixed. Their --ignore-vuln flags came
        # off WITH the widen: a suppression for a vulnerability that is no
        # longer in the audited tree is suppression debt, and leaving it
        # armed would mask a future regression to the same IDs.
        #
        # The RESIDUAL 4.x-floor exposure (a user who pins transformers 4.x
        # inside the still-admitted band carries the four advisories) is
        # documented for users in SECURITY.md with the exposure analysis and
        # the remedy (transformers>=5.5 clears all four).
        run: |
          pip-audit \
            --ignore-vuln PYSEC-2026-3624


  attest:
    name: Executed-test floors (every leg)
    # One check for the whole workflow: every test job above declares its
    # legs' floors in a legs.floor file beside its junit; this job checks all
    # of them, so a leg whose suite silently skipped or hollowed out is red.
    needs: [smoke-matrix, tier, latest-canary, capture-byte-oracle, preview-backends, hf-band-legs, lit-real, bridges-real, peer-recipes, brainscore-live, tlens-oracle-canary, netron-vendor, model-explorer-contract]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: junit-*
          path: ${{ runner.temp }}/junit

      - name: Check every leg's executed-test floor
        run: python3 scripts/check_ci_executed_tests.py --legs "${{ runner.temp }}/junit"
