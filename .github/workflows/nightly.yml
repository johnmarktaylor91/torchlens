name: Nightly

# Everything a pull request does not run, once a night: the supported-version
# smoke matrix (torch floors to newest admitted, every advertised python), the
# latest-torch canary, the not-slow tier in the shards test-tiers.json
# declares, coverage floors, the byte oracles, the preview backends, the
# packaging and wheel gates, the real-dependency bridge legs and the
# dependency audit.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# Default-deny token scope: every job in this workflow only reads the repo.
permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  smoke-matrix:
    # NO event-name guard here (grind r5, b10 R82-1): inside a reusable
    # workflow `github.event_name` is the CALLER's event, so a former
    # `if: pull_request || push` condition meant that adding
    # `workflow_dispatch:`/`schedule:` to release.yml would SKIP every test
    # row while the called workflow still reported SUCCESS to
    # `needs: [tests]` — a release with zero tests executed. Duplicate runs
    # are already handled by the concurrency group above.
    name: ${{ matrix.track }} (torch ${{ matrix.torch }}, py ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Every supported-version row except the pinned one, which runs on
        # every pull request (pr.yml). Exact admitted CPU pairs; ecosystem
        # drift is isolated to the latest-canary job below.
        include:
          - track: floor
            python: "3.10"
            torch: "2.1.2+cpu"
            torchvision: "0.16.2+cpu"
            numpy: "numpy==1.26.4"
            constraints: .github/workflows/numpy1-constraints.txt
            scope: smoke
          - track: floor
            python: "3.11"
            torch: "2.1.2+cpu"
            torchvision: "0.16.2+cpu"
            numpy: "numpy==1.26.4"
            constraints: .github/workflows/numpy1-constraints.txt
            scope: smoke
          # r7 R85-1: pyproject declares THREE python-conditioned torch
          # floors (>=2.1 for py<3.12, >=2.2 for py3.12, >=2.6 for py3.13)
          # but CI exercised only the first — the 3.12/3.13 claims were
          # asserted in metadata and executed nowhere. These two rows run
          # each conditioned floor on exactly the interpreter that declares
          # it.
          - track: floor
            python: "3.12"
            torch: "2.2.2+cpu"
            torchvision: "0.17.2+cpu"
            numpy: "numpy==1.26.4"
            constraints: .github/workflows/numpy1-constraints.txt
            scope: smoke
          - track: floor
            python: "3.13"
            torch: "2.6.0+cpu"
            torchvision: "0.21.0+cpu"
            transformers: "5.18.0"
            numpy: numpy
            scope: smoke
          - track: canonical
            python: "3.10"
            torch: "2.8.0+cpu"
            torchvision: "0.23.0+cpu"
            transformers: "5.18.0"
            numpy: numpy
            scope: smoke
          - track: canonical
            python: "3.11"
            torch: "2.8.0+cpu"
            torchvision: "0.23.0+cpu"
            transformers: "5.18.0"
            numpy: numpy
            scope: smoke
            # ONE gating row runs with pytest-randomly installed (grind r4,
            # reopened R76/3.16.4: the plugin was declared in the [test]
            # extra but no release-gating leg installed it, so the
            # order-isolation guards skipped on every PR and randomized-order
            # coverage existed only on scheduled legs). This row's smoke run
            # shuffles under a fresh seed each run -- the seed prints in the
            # pytest header for reproduction -- while the other five rows
            # stay definition-ordered.
            randomized: "1"
          - track: newest-admitted
            python: "3.11"
            torch: "2.13.0+cpu"
            torchvision: "0.28.0+cpu"
            transformers: "5.18.0"
            numpy: numpy
            scope: smoke
          - track: newest-admitted
            python: "3.12"
            torch: "2.13.0+cpu"
            torchvision: "0.28.0+cpu"
            transformers: "5.18.0"
            numpy: numpy
            scope: smoke
            # Python >= 3.12 is advertised support AND selects the
            # sys.monitoring escape-detection path, which no 3.10/3.11 row can
            # execute. Before this row existed the path had NO CI coverage and
            # its only >=3.12-gated unit test had rotted unnoticed (T13.4).
          - track: newest-admitted
            python: "3.13"
            torch: "2.13.0+cpu"
            torchvision: "0.28.0+cpu"
            transformers: "5.18.0"
            numpy: numpy
            scope: smoke
            # Python 3.13 was the last classifier-advertised interpreter with
            # ZERO test execution anywhere in CI — its only appearance was
            # nightly's resolution-only `uv pip compile` loop, which imports
            # nothing (grind r5, b10 R85-1). The classifier<->matrix lockstep
            # test in tests/test_ci_packaging_gates.py now requires a real
            # row per advertised interpreter, so dropping this row goes red.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No uv.lock: key the uv cache on the dependency declarations.
          cache-dependency-glob: "pyproject.toml"

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          # Rank layout renders with neato -n; fail here if this Graphviz lacks it.
          echo 'graph { a -- b }' | neato -Tsvg > /dev/null

      - name: Install exact CPU test environment
        env:
          TORCH_VERSION: ${{ matrix.torch }}
          TORCHVISION_VERSION: ${{ matrix.torchvision }}
          NUMPY_SPEC: ${{ matrix.numpy }}
          CONSTRAINTS: ${{ matrix.constraints }}
        run: |
          # Rows that pin numpy 1.x carry a constraints file for packages that
          # need numpy 2 without declaring it (see the file's header).
          constraint_args=()
          if [ -n "${CONSTRAINTS}" ]; then constraint_args=(-c "${CONSTRAINTS}"); fi
          # --index-strategy unsafe-best-match rationale (R61, reviewed): both indexes are reputable and the torch pins are exact `==X+cpu` local versions only the torch index serves, so cross-index confusion cannot select a different name/version; first-index would break resolving torch's +cpu artifacts alongside PyPI deps.
          # The viz extra (matplotlib, torchshow, lovely-tensors) is installed
          # because tviz is shipped surface with smoke-marked render tests.
          uv pip install --system "${constraint_args[@]}" \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,tabular,viz]" \
            "torch==${TORCH_VERSION}" \
            "torchvision==${TORCHVISION_VERSION}" \
            "${NUMPY_SPEC}" \
            "pydot==4.0.1" \
            "graphviz==0.21"

      - name: Install transformers for the R0 real-model sweep
        # Testing MEMO A4/A6 (lane P04): the R0 deep sweep (config-built real
        # upstream classes, zero network) is BLOCKING on every row whose torch
        # admits the pinned transformers (5.x floor is torch>=2.4). The three
        # torch<2.4 floor rows run without it -- gate R0_TRANSFORMERS_RUNTIME
        # in tests/real_model/r0/conftest.py names this split -- until the
        # HF_FLOOR version leg (B2) lands per-version expectations.
        if: matrix.transformers != ''
        run: uv pip install --system "transformers==${{ matrix.transformers }}"

      - name: Arm randomized test ordering (order-isolation gate row)
        if: matrix.randomized == '1'
        # Exact pin, matching the release-gating pin discipline; the [test]
        # extra declares the plugin unpinned for contributors, and the
        # scheduled .[test] legs resolve it freely.
        run: uv pip install --system "pytest-randomly==4.1.0"

      - name: Validate installed environment
        env:
          TORCH_VERSION: ${{ matrix.torch }}
          TORCHVISION_VERSION: ${{ matrix.torchvision }}
        run: |
          uv pip check
          python - <<'PY'
          import os

          import torch
          import torchvision
          from torchvision.ops import nms

          assert torch.__version__ == os.environ["TORCH_VERSION"]
          assert torchvision.__version__ == os.environ["TORCHVISION_VERSION"]
          boxes = torch.tensor([[0.0, 0.0, 1.0, 1.0]])
          scores = torch.tensor([1.0])
          assert nms(boxes, scores, 0.5).tolist() == [0]
          print(torch.__version__, torchvision.__version__)
          PY

      - name: Run smoke tests and compatibility coverage
        if: matrix.scope == 'smoke'
        env:
          TORCHLENS_ORACLE_ENFORCE: ${{ matrix.oracle_enforce }}
          # One torch thread per xdist worker: intra-op threads on top of
          # four workers oversubscribe the runner and inflate the duration
          # tripwire's measurements (lane L15). The tripwire aggregates
          # across workers, so it stays armed under -n.
          OMP_NUM_THREADS: "1"
        run: |
          pytest tests/ -m smoke -n 4 --tb=short -q \
            --junitxml="${{ runner.temp }}/junit/smoke.junit.xml"
          # `serial` tests are load- or memory-sensitive: run them without
          # xdist so parallel workers never starve them (marker contract).
          # Only files carrying the marker are collected: a whole-suite
          # single-process collection costs ~95 s.
          mapfile -t serial_files < <(grep -rlE --include="test_*.py" "mark\.serial" tests)
          pytest "${serial_files[@]}" -m "serial and not slow and not rare and not heavy" --tb=short -q
          pytest tests/test_torch_compat.py --tb=short -q

      - name: Declare the executed-test floor (smoke suite)
        if: matrix.scope == 'smoke'
        # Executed-floor attestation on EVERY smoke row (previously only the
        # nightly preview-backend legs had one): a row where collection drift,
        # a conftest guard, or mass importorskip/oracle skipping hollows out
        # the suite must go red, not green. The smoke tier selects ~1,420
        # tests (re-trued 2026-10-02 to 710 from 1,421 collected, when the tier
        # was cut from ~9,900 to a coverage-chosen subset; 2026-09-01 it was
        # 4609 from 9218, AUD-CODE 0.3:
        # the 2,830 literal sat at 30.7% of the live tier; before that,
        # 2026-08-26, megaplan D13: the 2,500 floor had lagged
        # the tier again, tolerating a silent 56% hollow-out against a comment
        # intending ~50% -- the same drift class as r7 R41's "~3900"/1900
        # pair); the floor is roughly half so normal churn and per-torch-
        # version skips never trip it, the 15% skip-fraction bound scales
        # with the selection, and tests/test_gate_infra_floor_drift.py now
        # RE-DERIVES the floor from the live selection count so this class
        # of drift goes red instead of waiting for the next audit.
        run: |
          echo "smoke.junit.xml 710 0.15" >> "${{ runner.temp }}/junit/legs.floor"

      - name: R0 real-model gate (blocking; PASSED-count attested)
        if: matrix.transformers != ''
        # Testing MEMO section 10 PR row: the 14-family R0 deep sweep --
        # structure, attn-impl facet diff, absence-claim adjudication, kwargs
        # identity, payload identity, pass-qualification pin, config
        # fingerprints -- at ZERO network bytes. The smoke selection above
        # already runs these (they are smoke-marked); this dedicated run is
        # the gate-shaped attestation: exact PASSED floor, so a skip cascade
        # or a fail-tolerant future refactor cannot hollow it out.
        # TORCHLENS_REQUIRE_R0 flips gate R0_TRANSFORMERS_RUNTIME fail-closed:
        # a broken transformers install on a CLAIMING row is red, never a skip.
        env:
          TORCHLENS_REQUIRE_R0: "1"
        run: |
          pytest tests/real_model/r0 -p no:randomly --tb=short -q \
            --junitxml="${{ runner.temp }}/junit/r0.junit.xml"
          echo "r0.junit.xml 0 --min-passed 71" >> "${{ runner.temp }}/junit/legs.floor"

      - name: Upload junit and executed-test floors
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/junit/
          if-no-files-found: error
          retention-days: 30

  tier:
    name: Not-slow tier (shard ${{ matrix.shard }} of 8)
    # The tier test-tiers.json declares as pre_merge: 'not rare and not slow'
    # in 8 single-process pytest-split shards with one seed, so serial and
    # heavy tests run here safely, on the pinned environment.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-dependency-glob: "pyproject.toml"

      - name: Install graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          echo 'graph { a -- b }' | neato -Tsvg > /dev/null

      - name: Install torch and TorchLens
        run: |
          cat > "${{ runner.temp }}/torch-2.13-constraints.txt" <<'EOF2'
          torch==2.13.0+cpu
          torchvision==0.28.0+cpu
          EOF2
          uv pip install --system -c "${{ runner.temp }}/torch-2.13-constraints.txt" \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,test,tabular,viz]" \
            -r requirements-test-tiers.txt \
            "torch==2.13.0+cpu" \
            "torchvision==0.28.0+cpu" \
            "transformers==5.18.0"
          uv pip check
          python -c "import torch, torchvision; assert torch.__version__ == '2.13.0+cpu', torch.__version__; print(torch.__version__, torchvision.__version__)"

      - name: Run the shard
        env:
          OMP_NUM_THREADS: "1"
        run: |
          pytest tests/ -o addopts= -m "not rare and not slow" \
            --splits 8 --group "${{ matrix.shard }}" --splitting-algorithm least_duration \
            -p randomly --randomly-seed=20261003 --tb=short \
            --junitxml="${{ runner.temp }}/junit/tier-${{ matrix.shard }}.xml"

      - name: Declare the executed-test floor
        # About half the shard's selection (24,810 tests over 8 shards,
        # measured 2026-10-30), the same margin the smoke floor keeps.
        run: echo "tier-${{ matrix.shard }}.xml 1500" >> "${{ runner.temp }}/junit/legs.floor"

      - name: Fresh-seed generative property sweep
        if: matrix.shard == 1
        run: |
          for offset in 0 1 2 3; do
            TORCHLENS_FUZZ_SEED="$(( ${{ github.run_id }} % 1000000000 + offset ))" \
              pytest tests/test_generative_properties_r73.py tests/test_tlspec_parse_fuzz.py \
                -m '' -q --tb=short -p no:randomly
          done

      - name: Upload junit and executed-test floors
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/junit/
          if-no-files-found: error
          retention-days: 30

  latest-canary:
    name: Latest Torch canary
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No uv.lock: key the uv cache on the dependency declarations.
          cache-dependency-glob: "pyproject.toml"

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          # Rank layout renders with neato -n; fail here if this Graphviz lacks it.
          echo 'graph { a -- b }' | neato -Tsvg > /dev/null

      - name: Install latest CPU test environment
        run: |
          # --index-strategy unsafe-best-match rationale (R61, reviewed): both indexes are reputable and the torch pins are exact `==X+cpu` local versions only the torch index serves, so cross-index confusion cannot select a different name/version; first-index would break resolving torch's +cpu artifacts alongside PyPI deps.
          # torchvision is floored so torch and torchvision resolve as a PAIR: on
          # a day the CPU index has a new torch before its matching torchvision,
          # an unfloored request backtracks torchvision to the ancient 0.2.0
          # (no torch pin, no torchvision.ops) instead of picking the newest
          # torch that has a matching torchvision. The validate step prints the
          # resolved pair.
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,tabular,viz]" \
            torch \
            "torchvision>=0.18" \
            transformers \
            timm \
            "pydot==4.0.1" \
            "graphviz==0.21"

      - name: Validate installed environment
        run: |
          uv pip check
          python - <<'PY'
          import timm
          import torch
          import torchvision
          import transformers
          from torchvision.ops import nms

          boxes = torch.tensor([[0.0, 0.0, 1.0, 1.0]])
          scores = torch.tensor([1.0])
          assert nms(boxes, scores, 0.5).tolist() == [0]
          print(
              "torch", torch.__version__,
              "torchvision", torchvision.__version__,
              "transformers", transformers.__version__,
              "timm", timm.__version__,
          )
          PY

      - name: Run smoke tests and compatibility coverage
        env:
          # One torch thread per xdist worker (see tests.yml smoke step).
          OMP_NUM_THREADS: "1"
        run: |
          pytest tests/ -m smoke -n 4 --tb=short -q \
            --junitxml="${{ runner.temp }}/junit/canary-smoke.junit.xml"
          # `serial` tests run without xdist (see tests.yml smoke step).
          mapfile -t serial_files < <(grep -rlE --include="test_*.py" "mark\.serial" tests)
          pytest "${serial_files[@]}" -m "serial and not slow and not rare and not heavy" --tb=short -q
          pytest tests/test_torch_compat.py --tb=short -q

      - name: Declare the executed-test floor (canary suite)
        # Same executed-floor attestation as every tests.yml smoke row: an
        # unattended leg where a new torch mass-skips or hollows collection
        # must go red, not green (grind r3, R82). Floor is roughly half the
        # ~1,420-test smoke selection (re-trued 2026-10-02 when the tier was cut
        # to a coverage-chosen subset); the
        # canary runs an UNADMITTED torch, so no skip-fraction bound — extra
        # per-version skips are exactly what it exists to surface loudly.
        run: |
          echo "canary-smoke.junit.xml 710" >> "${{ runner.temp }}/junit/legs.floor"

      - name: R0 real-model sweep on latest transformers (PASSED-count attested)
        # Testing MEMO A6: the 14-family config-built sweep runs against the
        # UNPINNED latest transformers. A fingerprint/op-count/facet drift is
        # exactly what this leg exists to surface -- it fails the run and
        # feeds the canary-break triage, never a PR gate.
        run: |
          pytest tests/real_model/r0 -p no:randomly --tb=short -q \
            --junitxml="${{ runner.temp }}/junit/canary-r0.junit.xml"
          echo "canary-r0.junit.xml 0 --min-passed 71" >> "${{ runner.temp }}/junit/legs.floor"

      - name: Restore the pinned artifact cache (exact key, no prefix fallback)
        id: artifact-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifact-cache
          key: ${{ hashFiles('tests/real_model/artifact_registry.jsonl') }}-canary-v1

      - name: Preflight-fetch the canary R1 arm (DistilGPT2 core)
        # The ONLY networked model step; every blob is sha256-verified, cache
        # hits are rehashed (verify-on-hit), and the byte cap is linted with
        # lstat. A missing artifact fails HERE, loudly -- never a test skip.
        run: |
          python scripts/preflight_fetch_artifacts.py fetch --venue canary --cache-dir .artifact-cache

      - name: DistilGPT2 R1 core, offline, exact-passed-ID floor
        run: |
          eval "$(python scripts/preflight_fetch_artifacts.py print-env --cache-dir .artifact-cache | sed 's/^/export /')"
          pytest tests/real_model/r1 -k distilgpt2 -p no:randomly --tb=short -q \
            --junitxml="${{ runner.temp }}/junit/canary-r1.junit.xml"
          echo "canary-r1.junit.xml 0 --min-passed 1 --passed-ids tests/real_model/r1/canary_passed_ids.txt" >> "${{ runner.temp }}/junit/legs.floor"

      - name: Upload junit and executed-test floors
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/junit/
          if-no-files-found: error
          retention-days: 30


  perf-gate:
    name: Same-run performance regression gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Scheduled/manual only: the interleaved A/B gate costs 10-15 minutes and must
    # not extend the PR-blocking path. Comparing adjacent commits on the same
    # runner avoids treating developer-machine absolute baselines as portable.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history + tags: the cumulative leg anchors on the latest
          # release tag, not just HEAD^ (r7 R30).
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No uv.lock: key the uv cache on the dependency declarations.
          cache-dependency-glob: "pyproject.toml"

      - name: Install exact canonical CPU benchmark environment
        run: |
          uv venv "${{ runner.temp }}/perf-venv" --python 3.11
          # --index-strategy unsafe-best-match rationale (R61, reviewed): both indexes are reputable and the torch pins are exact `==X+cpu` local versions only the torch index serves, so cross-index confusion cannot select a different name/version; first-index would break resolving torch's +cpu artifacts alongside PyPI deps.
          uv pip install --python "${{ runner.temp }}/perf-venv/bin/python" \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,tabular]" \
            "torch==2.8.0+cpu" \
            "torchvision==0.23.0+cpu" \
            numpy

      - name: Prepare adjacent-commit and release-anchor baselines
        # r7 R30 (opus MED, round-1 carry): the adjacent-commit differential
        # alone is baselined-in by the NEXT commit (regress in C, land D
        # before the nightly, and every future comparison is D-vs-C) and
        # carries no cumulative ceiling (ten sequential 9% regressions pass
        # ten nightly gates). The release tag is the fixed anchor: it moves
        # only when a release ships, so slow drift accumulates against it
        # instead of being re-based away nightly.
        run: |
          git worktree add --detach "${{ runner.temp }}/perf-base" HEAD^
          anchor="$(git describe --tags --abbrev=0)"
          echo "release anchor: $anchor"
          git worktree add --detach "${{ runner.temp }}/perf-anchor" "$anchor"

      - name: Interleaved A/B gate against the parent and the release anchor
        # perf_ab alternates parent, anchor and current per cell and per
        # round (arm order rotates), pools 5 rounds so every cold-start row
        # has 5 samples, treats drift in the no-TorchLens control rows as
        # INCONCLUSIVE (warned, not failed), re-measures a flagged row before
        # failing it, and fails a row confirmed at >=1.5x even on a noisy
        # runner. Both comparisons always run: 10% per commit, 25% cumulative
        # against the release tag. Doc: benchmarks/perf_ab.py.
        env:
          PERF_PYTHON: ${{ runner.temp }}/perf-venv/bin/python
        run: |
          PYTHONPATH=. "$PERF_PYTHON" -m benchmarks.perf_ab \
            --base "${{ runner.temp }}/perf-base" \
            --anchor "${{ runner.temp }}/perf-anchor" \
            --current "$GITHUB_WORKSPACE" \
            --rounds 5 --samples 4 --timeout 180 \
            --workdir "${{ runner.temp }}/perf-ab-cells" \
            --out "${{ runner.temp }}/perf-ab.json"

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-perf-gate
          path: |
            ${{ runner.temp }}/perf-ab.json

  coverage:
    name: Coverage floor (smoke tier)
    # ubuntu-24.04, not ubuntu-latest (2026-10-20): ubuntu-latest became 26.04,
    # whose Graphviz 14.1 leaves neato (rank layout) out of the graphviz package
    # and writes different SVG bytes than the Graphviz 2.42 that the committed
    # galleries and render goldens are checked against.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # First measured coverage gate (grind r3, SF-19: four consecutive review
    # passes found NO coverage job anywhere). The smoke tier under
    # branch-coverage instrumentation measured 64% total on 2026-08-15; the
    # floor sits at 55 so environment variance and per-version skips never
    # trip it while a mass-hollowing regression (a subsystem's tests skipping
    # or a package dropping out of the suite) always does. Raise the floor
    # deliberately as coverage grows; never lower it to pass (tripwire).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No uv.lock: key the uv cache on the dependency declarations.
          cache-dependency-glob: "pyproject.toml"

      - name: Install graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          # Rank layout renders with neato -n; fail here if this Graphviz lacks it.
          echo 'graph { a -- b }' | neato -Tsvg > /dev/null

      - name: Install canonical CPU test environment
        run: |
          # torch 2.13.0 is the canonical stack (the newest-admitted tests.yml
          # row). On torch 2.8.0 the merged-trace live-capture tests skip (no
          # census-vetted distributed snapshot exists for 2.8), and with them
          # every test that saves/loads a merged artifact: measured 2026-10-02,
          # torchlens/merged reached 66.3% against its 80% floor on 2.8 even
          # though ALL merged-related tests together cap at 80.0% statements
          # there, versus 83.5% on 2.13. The floor is never lowered; the
          # coverage job measures on the stack where the package's tests run.
          # The merged floor is measured on 2.13 because live-merge tests need
          # a census-vetted distributed snapshot; snapshots for 2.8 and 2.14
          # are the open F1 follow-up (round 2).
          # --index-strategy unsafe-best-match rationale (R61, reviewed): both indexes are reputable and the torch pins are exact `==X+cpu` local versions only the torch index serves, so cross-index confusion cannot select a different name/version; first-index would break resolving torch's +cpu artifacts alongside PyPI deps.
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,test,tabular]" \
            "torch==2.13.0+cpu" \
            "torchvision==0.28.0+cpu" \
            "transformers==5.18.0"
          uv pip check

      - name: Run the smoke tier under coverage with a floor
        # No deselects: the duration-budget machinery itself skips recording
        # under coverage instrumentation (tests/conftest.py, r7 R41/R72 --
        # the old single --deselect here named a test that had been RENAMED,
        # so it silently excluded nothing while claiming the carve-out).
        # pytest-cov combines the xdist workers' data before the floors run.
        env:
          OMP_NUM_THREADS: "1"
        run: |
          pytest tests/ -m smoke -n 4 \
            --cov=torchlens --cov-branch \
            --cov-report=term --cov-report=xml:"${{ runner.temp }}/coverage.xml" \
            --cov-report=json:"${{ runner.temp }}/coverage.json" \
            --cov-fail-under=55 \
            --tb=short -q

      - name: Enforce per-package coverage floors
        # r7 R72 (sol MED): the aggregate floor alone let a subsystem hollow
        # out while the total stayed above 55. Verdict-critical packages are
        # bound individually; floors live in the script (single authority).
        run: |
          python scripts/check_package_coverage_floors.py "${{ runner.temp }}/coverage.json"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-coverage
          path: ${{ runner.temp }}/coverage.xml

  capture-byte-oracle:
    name: Capture-characterization byte oracle (torch 2.13.0, py 3.10)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The capture-characterization goldens embed raw float-byte digests, so
    # they are enforceable only on their recording environment (py3.10 +
    # torch 2.13.0; the version gate strips the build tag, mirroring
    # tests/_oracle_env.py). The 31-case matrix regenerates each record in an
    # isolated subprocess (~8 min), so it runs nightly rather than
    # PR-blocking. The executed-floor attestation proves the suite actually
    # ran instead of version-skipping to green (T13.2).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No uv.lock: key the uv cache on the dependency declarations.
          cache-dependency-glob: "pyproject.toml"

      - name: Install the goldens' recording-environment torch
        run: |
          # --index-strategy unsafe-best-match rationale (R61, reviewed): both indexes are reputable and the torch pins are exact `==X+cpu` local versions only the torch index serves, so cross-index confusion cannot select a different name/version; first-index would break resolving torch's +cpu artifacts alongside PyPI deps.
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,tabular]" \
            "torch==2.13.0+cpu" \
            numpy
          uv pip check
          python -c 'import torch; assert torch.__version__ == "2.13.0+cpu", torch.__version__'

      - name: Run the slow capture-characterization matrix
        run: |
          pytest tests/capture_oracle/ -m slow --tb=short -q \
            --junitxml="${{ runner.temp }}/junit/capture-oracle.junit.xml"

      - name: Declare the executed-test floor (capture-oracle matrix)
        # Floor at roughly half the 31-case matrix: a version-gate or golden
        # drift that mass-skips the characterization must go red, while
        # adding/removing individual cases does not.
        run: |
          echo "capture-oracle.junit.xml 16" >> "${{ runner.temp }}/junit/legs.floor"

      - name: Upload junit and executed-test floors
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/junit/
          if-no-files-found: error
          retention-days: 30

  preview-backends:
    name: Preview backend tests (${{ matrix.backend }})
    # ubuntu-24.04, not ubuntu-latest (2026-10-20): ubuntu-latest became 26.04,
    # whose Graphviz 14.1 leaves neato (rank layout) out of the graphviz package
    # and writes different SVG bytes than the Graphviz 2.42 that the committed
    # galleries and render goldens are checked against.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # One framework per job: the frameworks carry conflicting pins and native
    # runtimes that segfault when co-imported in one process (test collection
    # imports every framework-marked module), so a combined env cannot be
    # gated. With a single framework installed, the other suites' module-level
    # importorskip guards skip cleanly during collection.
    strategy:
      fail-fast: false
      matrix:
        include:
          # executed_floor is a per-leg minimum EXECUTED (non-skipped) test
          # count, set to roughly half each suite's current size so a mass
          # importorskip/marker-drift regression fails the leg while normal
          # test-count churn does not. A floor of 1 would let a 49-of-50 skip
          # stay green.
          - backend: tf
            install: tensorflow-cpu
            marker: tf_backend
            import_check: "import tensorflow, keras"
            executed_floor: 18
          - backend: jax
            install: '"jax[cpu]" equinox flax'
            marker: backend_jax
            import_check: "import jax, jax.numpy, equinox, flax"
            executed_floor: 60
          - backend: tinygrad
            # Pinned to the exact version the backend runtime asserts. The
            # replay/derived-grad oracles require the PYTHON device.
            install: '"tinygrad==0.13.0"'
            marker: backend_tinygrad
            dev: PYTHON
            import_check: "import tinygrad"
            executed_floor: 25
          - backend: paddle
            # Pinned to the 3.3 minor stream the preview suite is validated
            # against (paddle 3.3.x in the parity env); paddle minors have
            # historically shifted C-extension/co-import behavior, so new
            # minors join the matrix deliberately, not by drift.
            install: '"paddlepaddle>=3.3,<3.4"'
            marker: backend_paddle
            import_check: "import paddle"
            executed_floor: 22
          - backend: mlx
            # MLX ships manylinux CPU wheels, so its suite runs on Linux CI;
            # pinned to 0.26.3 because the 0.26.5 manylinux wheel is missing
            # libmlx.so. Metal-path coverage still needs Apple silicon.
            install: '"mlx==0.26.3"'
            marker: backend_mlx
            import_check: "import mlx.core, mlx.nn"
            executed_floor: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No uv.lock: key the uv cache on the dependency declarations.
          cache-dependency-glob: "pyproject.toml"

      - name: Install Graphviz
        # draw() paths in this job need the dot binary (GraphvizUnavailableError
        # otherwise); every other rendering job installs it the same way.
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          # Rank layout renders with neato -n; fail here if this Graphviz lacks it.
          echo 'graph { a -- b }' | neato -Tsvg > /dev/null

      - name: Install TorchLens and the ${{ matrix.backend }} preview backend
        run: |
          uv pip install --system -e ".[dev,test,tabular]"
          uv pip install --system ${{ matrix.install }}

      - name: Verify the ${{ matrix.backend }} runtime imports
        # A missing or import-broken framework must fail the leg here, not
        # dissolve into importorskip-skipped tests downstream.
        run: |
          python -c '${{ matrix.import_check }}'

      - name: Run ${{ matrix.backend }} preview backend tests
        env:
          # MLX's CPU JIT emits _FloatNN typedefs newer g++ rejects; the
          # uncompiled path is equivalent for capture. No-op for other legs.
          MLX_DISABLE_COMPILE: "1"
          TORCHLENS_RUN_UNSTABLE_MLX_TESTS: "1"
          # tinygrad leg only; empty (unread) elsewhere.
          DEV: ${{ matrix.dev || '' }}
        run: |
          pytest tests/ -m "${{ matrix.marker }} and not slow" --tb=short \
            --junitxml="${{ runner.temp }}/junit/preview-${{ matrix.backend }}.junit.xml"

      - name: Declare the executed-test floor (${{ matrix.backend }} suite)
        # Second tripwire: even with the runtime importable, a mostly-skipped
        # suite (marker drift, collection regression, importorskip cascade)
        # must not stay green; each leg carries its own executed-test floor.
        run: |
          echo "preview-${{ matrix.backend }}.junit.xml ${{ matrix.executed_floor }}" >> "${{ runner.temp }}/junit/legs.floor"

      - name: Upload junit and executed-test floors
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/junit/
          if-no-files-found: error
          retention-days: 30

  metadata-gates:
    name: Extras resolvability and dependency floors
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No uv.lock: key the uv cache on the dependency declarations.
          cache-dependency-glob: "pyproject.toml"

      - name: Install Graphviz
        # draw() paths in this job need the dot binary (GraphvizUnavailableError
        # otherwise); every other rendering job installs it the same way.
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          # Rank layout renders with neato -n; fail here if this Graphviz lacks it.
          echo 'graph { a -- b }' | neato -Tsvg > /dev/null

      - name: Every declared extra resolves on every advertised interpreter
        # First leg that resolves ANY extra beyond dev/test/tabular (grind r4,
        # R83-1: `torchlens[neuro]` required a distribution that does not
        # exist on PyPI and stayed uninstallable for every user because no CI
        # leg ever tried to resolve it). Resolution-only -- metadata
        # solvability across the advertised interpreter range, no installs.
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile
          import tomllib

          with open("pyproject.toml", "rb") as fh:
              extras = sorted(tomllib.load(fh)["project"]["optional-dependencies"])
          # KNOWN-UNSATISFIABLE LEDGER (disclosed skips, never silent).
          # EMPTY: both meta-extras resolve and EVERY declared extra is gated
          # here. lit-nlp stays out of the all/all-stretch rollup because it
          # requires numpy<2; the shap extra's floor was widened to 0.45.1
          # (the bridge is bit-identical to DeepExplainer on shap 0.45.1), so
          # the [lit,shap] combination now resolves and the lit-real job
          # asserts it. If an extra stops resolving, add it here WITH its
          # conflict named, and report loudly.
          known_unsatisfiable = set()
          failures = []
          fixed = []
          with tempfile.TemporaryDirectory() as tmp:
              lock = os.path.join(tmp, "lock.txt")
              for python_version in ("3.10", "3.11", "3.12", "3.13"):
                  for extra in extras:
                      proc = subprocess.run(
                          ["uv", "pip", "compile", "pyproject.toml",
                           "--extra", extra, "--python-version", python_version,
                           "--no-header", "-q", "-o", lock],
                          capture_output=True, text=True,
                      )
                      ok = proc.returncode == 0
                      if extra in known_unsatisfiable:
                          if ok:
                              fixed.append((python_version, extra))
                          continue
                      if not ok:
                          failures.append((python_version, extra, proc.stderr.strip()))
          for python_version, extra, err in failures:
              print(f"UNRESOLVABLE: [{extra}] on {python_version}\n{err}\n")
          if fixed:
              print("NOTE: known-unsatisfiable extras now resolve; update this ledger:", fixed)
          print(f"checked {len(extras) - len(known_unsatisfiable)} extras x 4 interpreters; "
                f"skipped (disclosed, queued owner fork): {sorted(known_unsatisfiable)}")
          sys.exit(1 if failures else 0)
          PY

      - name: Declared dependency floors install and import (lowest-direct)
        # The floors declared in pyproject are EXERCISED here (grind r4,
        # b2:B6 third round: numpy/packaging/tqdm/graphviz were bare names
        # and no leg anywhere resolved lowest). torch is pinned to the floor
        # leg's exact CPU build (the smoke matrix already exercises the torch
        # floor; unpinned lowest-direct would pull the multi-GB CUDA build).
        run: |
          uv venv "${{ runner.temp }}/floor-venv" --python 3.10
          # --index-strategy unsafe-best-match rationale (R61, reviewed): both indexes are reputable and the torch pins are exact `==X+cpu` local versions only the torch index serves, so cross-index confusion cannot select a different name/version; first-index would break resolving torch's +cpu artifacts alongside PyPI deps.
          uv pip install --python "${{ runner.temp }}/floor-venv/bin/python" \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            --resolution lowest-direct \
            -e . \
            "torch==2.1.2+cpu"
          "${{ runner.temp }}/floor-venv/bin/python" - <<'PY'
          import tempfile
          from pathlib import Path

          import graphviz
          import numpy
          import packaging
          import safetensors
          import tqdm
          import torch
          import torchlens as tl
          from torch import nn

          print("floors:", numpy.__version__, packaging.__version__,
                tqdm.__version__, graphviz.__version__, torch.__version__,
                safetensors.__version__)
          trace = tl.trace(nn.Sequential(nn.Linear(4, 3), nn.ReLU()), torch.randn(2, 4))
          assert trace.num_ops >= 2
          # r7 R83-3: the floors for safetensors (tlspec blobs) and pillow
          # (drawing surfaces) resolved here but were never EXERCISED -- a
          # floor too low to carry the API TorchLens calls still passed. One
          # save/load round-trip plus a draw() puts both on the floor path.
          with tempfile.TemporaryDirectory() as tmp:
              bundle = Path(tmp) / "floor.tlspec"
              tl.save(trace, str(bundle))
              loaded = tl.load(str(bundle))
              assert loaded.num_ops == trace.num_ops
              loaded.draw(vis_save_only=True, vis_outpath=str(Path(tmp) / "floor_graph"))
              loaded.cleanup()
          print("floor-env capture + save/load + draw OK")
          PY

  wheel:
    name: Wheel package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No uv.lock: key the uv cache on the dependency declarations.
          cache-dependency-glob: "pyproject.toml"

      - name: Build wheel and sdist with the release's exact builder
        # SINGLE PIN AUTHORITY (grind r4; hash-locked in R61): the builder
        # stack is installed hash-verified from the SAME lock the release job
        # installs before running build_command
        # (.github/workflows/release-requirements.txt; build_command itself
        # installs NOTHING inside the token scope), so this gate can never
        # silently attest a different builder than the release uses (the old
        # lockstep was comment-only). The lockstep assertions live in
        # tests/test_packaging_diet.py.
        # The dirty-tree guard makes the packaging provenance explicit: an
        # artifact must only ever attest the COMMITTED tree (grind r3, R84
        # LOW), and any stale build/ dir is removed because bdist_wheel
        # silently reuses build/lib and can resurrect files pruned since the
        # last build.
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "refusing to package a dirty tree"
            git status --short
            exit 1
          fi
          rm -rf build
          BUILD_PIN="$(grep -oE '^build==[0-9][0-9a-zA-Z.]*' .github/workflows/release-requirements.txt)"
          test -n "$BUILD_PIN" || { echo "no build== pin in release-requirements.txt"; exit 1; }
          echo "release builder: $BUILD_PIN"
          python -m pip install --require-hashes --only-binary :all: \
            -r .github/workflows/release-requirements.txt
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)" \
            python -m build --no-isolation --outdir "${{ runner.temp }}/dist"
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)" \
            python scripts/normalize_sdist.py \
            "${{ runner.temp }}"/dist/torchlens-*.tar.gz \
            "${{ runner.temp }}"/dist/torchlens-*.whl

      - name: Fail on a non-reproducible wheel or sdist (double-build gate)
        # Same commit + same SOURCE_DATE_EPOCH must give byte-identical
        # artifacts (grind r3, R86: six dist-info timestamps used to differ
        # on every wheel rebuild). The sdist joined the gate in grind r4
        # (gzip header wall-clock mtime, builder uid/gid in tar members),
        # and grind r5 (b10 R84-1/2) proved the same-runner rebuild held
        # every MACHINE-dependent field constant by construction — a gate
        # proving determinism while labelled reproducibility. The rebuild
        # therefore runs under a DIFFERENT umask (002 vs the runner's 022)
        # from a freshly re-checked-out tree, exercising exactly the
        # source-file-mode leak measured across checkouts; normalize_sdist
        # stamps modes in both artifacts so the shas must still match. The
        # stale local build/ tree is removed first: bdist_wheel silently
        # reuses build/lib and can resurrect files pruned since the last
        # build.
        run: |
          rm -rf build
          rebuild_src="${{ runner.temp }}/rebuild-src"
          git worktree add --detach "$rebuild_src" HEAD
          (
            cd "$rebuild_src"
            umask 002
            chmod -R g+w .
            SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)" \
              python -m build --no-isolation --outdir "${{ runner.temp }}/dist-rebuild"
            SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)" \
              python scripts/normalize_sdist.py \
              "${{ runner.temp }}"/dist-rebuild/torchlens-*.tar.gz \
              "${{ runner.temp }}"/dist-rebuild/torchlens-*.whl
          )
          git worktree remove --force "$rebuild_src"
          for kind in whl tar.gz; do
            first="$(sha256sum "${{ runner.temp }}"/dist/torchlens-*.$kind | cut -d' ' -f1)"
            second="$(sha256sum "${{ runner.temp }}"/dist-rebuild/torchlens-*.$kind | cut -d' ' -f1)"
            echo "$kind build 1: $first"
            echo "$kind build 2: $second"
            test "$first" = "$second"
          done

      - name: Install wheel in a clean venv
        run: |
          python -m venv "${{ runner.temp }}/wheel-venv"
          "${{ runner.temp }}/wheel-venv/bin/python" -m pip install --upgrade pip
          "${{ runner.temp }}/wheel-venv/bin/python" -m pip install "${{ runner.temp }}"/dist/torchlens-*.whl

      - name: Round-trip packaged tlspec
        working-directory: ${{ runner.temp }}
        run: |
          wheel-venv/bin/python -c "import torch, torchlens as tl; from torch import nn; from torchlens.validation import validate_tlspec; path='wheel-smoke.tlspec'; trace=tl.trace(nn.Linear(2, 1), torch.randn(1, 2), capture=tl.options.CaptureOptions(layers_to_save='none')); trace.save(path); validate_tlspec(path); loaded=tl.load(path); assert loaded.num_ops == trace.num_ops"

      - name: PEP 561 consumer smoke (installed wheel exposes its types)
        # Red-capable in BOTH directions (grind r3, R84 LOW: py.typed shipped
        # with no consumer-side proof it works): if py.typed were missing,
        # mypy refuses the import in the well-typed consumer (import-untyped)
        # AND stops seeing the deliberate type error in the ill-typed one.
        # mypy version matches the dev-extra pin; --follow-imports=silent
        # keeps third-party stub noise inside torchlens out of the verdict.
        working-directory: ${{ runner.temp }}
        run: |
          wheel-venv/bin/python -m pip install "mypy==2.1.0"
          printf 'import torchlens as tl\nx: str = tl.__version__\n' > consumer_good.py
          printf 'import torchlens as tl\ny: int = tl.__version__\n' > consumer_bad.py
          wheel-venv/bin/python -m mypy --follow-imports=silent consumer_good.py
          if wheel-venv/bin/python -m mypy --follow-imports=silent consumer_bad.py; then
            echo "mypy accepted an ill-typed consumer: the wheel's types are invisible"
            exit 1
          fi

  platform-canary:
    # macOS and Windows had ZERO controlled execution while the universal
    # py3-none-any wheel and explicit win32/darwin code paths ship (grind r5,
    # b10 R85-2): every core leg is Linux/CPU. This is a bounded canary — an
    # import + capture + save/load round-trip on each OS — not a support
    # claim; the CI-attested platform statement lives in
    # docs/reference/limitations.md.
    name: platform canary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # r7 R85-2: pinned OS images, not *-latest — this canary is the SOLE
        # evidence behind the CI-attested platform statement, its python and
        # torch are pinned, and a floating image silently moves the one
        # variable under test. Bump the images deliberately, with a dated
        # note, like every other pin in this repo.
        include:
          - os: macos-15
            torch-install: torch==2.13.0 torchvision==0.28.0
          - os: windows-2025
            torch-install: >-
              --index-url https://download.pytorch.org/whl/cpu
              --extra-index-url https://pypi.org/simple
              --index-strategy unsafe-best-match
              torch==2.13.0+cpu torchvision==0.28.0+cpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No uv.lock: key the uv cache on the dependency declarations.
          cache-dependency-glob: "pyproject.toml"

      - name: Install torchlens + torch
        shell: bash
        run: uv pip install --system -e . ${{ matrix.torch-install }}

      - name: Import, capture, and round-trip a trace
        shell: bash
        run: |
          python - <<'PY'
          import tempfile
          import os

          import torch
          import torch.nn as nn

          import torchlens as tl

          model = nn.Sequential(nn.Conv2d(3, 4, 3), nn.ReLU(), nn.Flatten(), nn.LazyLinear(5))
          trace = tl.trace(model, torch.randn(2, 3, 8, 8), save=tl.func("relu"))
          assert trace.backend == "torch"
          assert len(trace.layer_labels) > 0, "no layers captured"
          relu = trace["relu_1_2"]
          assert relu.out is not None

          with tempfile.TemporaryDirectory() as tmp:
              path = os.path.join(tmp, "canary.tlspec")
              tl.save(trace, path)
              loaded = tl.load(path)
              assert loaded.layer_labels == trace.layer_labels

          # r7 R85 (sol MED): the canary's model/input lived on the default
          # CPU, so MPS had ZERO executable coverage while device-specific
          # claims ship. On the Apple-silicon runner the capability assertion
          # is HARD (it cannot vacuously skip): MPS must be available, and a
          # capture + save/load round-trip must work on it. CUDA remains
          # CI-dark by disclosed limitation (no GPU runners; see
          # docs/reference/limitations.md "CI-attested platforms").
          import platform

          if platform.system() == "Darwin" and platform.machine() == "arm64":
              assert torch.backends.mps.is_available(), (
                  "Apple-silicon runner without MPS: the device canary would "
                  "silently stop covering the mps path"
              )
              mps_model = nn.Sequential(nn.Linear(4, 4), nn.ReLU()).to("mps")
              mps_input = torch.randn(2, 4, device="mps")
              mps_trace = tl.trace(mps_model, mps_input, save=tl.func("relu"))
              assert mps_trace["relu_1_2"].out.device.type == "mps"
              with tempfile.TemporaryDirectory() as tmp:
                  mps_path = os.path.join(tmp, "canary-mps.tlspec")
                  tl.save(mps_trace, mps_path)
                  mps_loaded = tl.load(mps_path)
                  assert mps_loaded.layer_labels == mps_trace.layer_labels
              print("mps canary OK")

          print("platform canary OK:", tl.__version__)
          PY

  hf-band-legs:
    # F36 (testing memo D3/B3; packaging_requests 2026-08-30, landed by D05):
    # every band the support-policy table CLAIMS is a band whose floor edge
    # and current release actually EXECUTE. Three reviewed constraint legs
    # under tests/support/proofnet/constraints/ (never resolver-chosen):
    #   hf_floor       transformers 4.45.2 / timm 1.0.3   (the claimed floor)
    #   hf_4_current   transformers 4.57.6 / timm 1.0.28  (weekly-refreshed)
    #   hf_5_candidate transformers 5.18.0 / timm 1.0.28  (the 5.x candidate)
    # Each runs the R0 real-model gate + the version-policy lockstep; the
    # candidate leg additionally runs the offline R1 + RG workflow gallery (and
    # the transforms-library tokenizer rows, floor transforms_lib_passed_ids.txt)
    # against the EXACT passed-ID floor (tests/workflow_gallery/rg_passed_ids.txt)
    # -- the enumerated-red manifest rows (rg_enumerated_red_hf5.tsv) carry no
    # test ids, so "reds match the manifest exactly" is enforced as: every
    # gallery node in the passed-ID floor PASSES (a new red is an absent pass,
    # a stale red is caught when the pinned typed settlement stops holding)
    # plus the manifest's own live-scenario lint. Non-blocking, non-claiming
    # until the manifest empties (published-band timing is FORK-2).
    name: HF band leg (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: hf_floor
            python: "3.10"
          - leg: hf_4_current
            python: "3.11"
          - leg: hf_5_candidate
            python: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No uv.lock: key the uv cache on the dependency declarations.
          cache-dependency-glob: "pyproject.toml"

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          # Rank layout renders with neato -n; fail here if this Graphviz lacks it.
          echo 'graph { a -- b }' | neato -Tsvg > /dev/null

      - name: Install the leg's reviewed pins
        run: |
          # --index-strategy unsafe-best-match rationale (R61, reviewed): both indexes are reputable and the torch pins are exact `==X+cpu` local versions only the torch index serves, so cross-index confusion cannot select a different name/version; first-index would break resolving torch's +cpu artifacts alongside PyPI deps.
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -c "tests/support/proofnet/constraints/${{ matrix.leg }}.txt" \
            -e ".[dev,test,tabular,hf]" \
            "torch==2.13.0+cpu" \
            "torchvision==0.28.0+cpu"
          uv pip check
          python -c 'import timm, transformers; print("transformers", transformers.__version__, "timm", timm.__version__)'

      - name: Version-policy lockstep (installed env sits inside this named leg)
        run: pytest tests/test_proofnet_version_policy.py -p no:randomly --tb=short -q

      - name: R0 real-model gate (PASSED-count attested; candidate leg runs every row)
        if: matrix.leg == 'hf_5_candidate'
        # Selected by PATH (every non-rare test under the two directories), not
        # by `-m 'smoke or real_model'`: after the smoke tier was cut to a
        # coverage-chosen subset (2026-10-02) the marker selection fell from
        # 71+ passed to 33 on the 4.x legs. The passed floor is unchanged.
        env:
          TORCHLENS_REQUIRE_R0: "1"
        run: |
          pytest tests/real_model/r0 tests/composition_expectations -m 'not rare' \
            -p no:randomly --tb=short -q --junitxml="${{ runner.temp }}/junit/r0.junit.xml"
          echo "r0.junit.xml 0 --min-passed 71" >> "${{ runner.temp }}/junit/legs.floor"

      - name: R0 real-model gate (PASSED-count attested; 4.x legs, band-keyed rows deselected)
        # The R0 op-count goldens (expectations_r0.json fingerprints), the
        # use_cache fingerprint row, the vendored GPT-2 tokenizer loader and
        # the distilbert sdpa axis are recorded on the transformers-5.x band
        # (measured 2026-09-02 by the D05 release gate: 25 of 139 rows red on
        # 4.45.2 and 4.57.6, every one a band-keyed expectation or fixture,
        # zero capture defects). They are deselected HERE, by name, until the
        # per-band expectations the tests.yml R0_TRANSFORMERS_RUNTIME note
        # promises land (the packaging-request ledger, D05 -> P04/F36 row);
        # the README support table states exactly this scope. Never widen the
        # deselection without re-truing that table. The T5 sdpa construction
        # pin is keyed to 5.18.0+, where upstream T5 gained sdpa support;
        # 4.45.2 and 4.57.6 still refuse sdpa at construction (ValueError),
        # so the pin is 5.x-band by definition (re-trued 2026-10-05).
        if: matrix.leg != 'hf_5_candidate'
        env:
          TORCHLENS_REQUIRE_R0: "1"
        run: |
          pytest tests/real_model/r0 tests/composition_expectations -m 'not rare' \
            -p no:randomly --tb=short -q --junitxml="${{ runner.temp }}/junit/r0.junit.xml" \
            --deselect tests/real_model/r0/test_realism_randinit_sweep.py \
            --deselect tests/real_model/r0/test_realism_randinit_axes.py::test_config_fingerprint_use_cache_row \
            --deselect "tests/real_model/r0/test_realism_randinit_axes.py::test_kwargs_identity_traced_equals_direct[distilbert]" \
            --deselect tests/real_model/r0/test_realism_registry.py::test_vendored_gpt2_tokenizer_loads_offline \
            --deselect tests/real_model/r0/test_realism_randinit_axes.py::test_t5_sdpa_now_builds_upstream
          echo "r0.junit.xml 0 --min-passed 71" >> "${{ runner.temp }}/junit/legs.floor"

      - name: Restore the pinned artifact cache (candidate leg only)
        if: matrix.leg == 'hf_5_candidate'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifact-cache
          key: ${{ hashFiles('tests/real_model/artifact_registry.jsonl') }}-nightly-v1

      - name: Preflight-fetch the R1/RG artifacts (candidate leg only; the ONLY networked model step)
        if: matrix.leg == 'hf_5_candidate'
        run: python scripts/preflight_fetch_artifacts.py fetch --venue nightly --cache-dir .artifact-cache

      - name: R1 + RG workflow gallery, offline, exact passed-ID floor (candidate leg only)
        if: matrix.leg == 'hf_5_candidate'
        run: |
          eval "$(python scripts/preflight_fetch_artifacts.py print-env --cache-dir .artifact-cache | sed 's/^/export /')"
          pytest tests/real_model/r1 tests/workflow_gallery tests/test_transforms_lib_real_models.py \
            -p no:randomly --tb=short -q --junitxml="${{ runner.temp }}/junit/rg.junit.xml"
          echo "rg.junit.xml 0 --passed-ids tests/workflow_gallery/rg_passed_ids.txt" >> "${{ runner.temp }}/junit/legs.floor"
          echo "rg.junit.xml 0 --passed-ids tests/real_model/r1/transforms_lib_passed_ids.txt" >> "${{ runner.temp }}/junit/legs.floor"
          pytest tests/workflow_gallery/test_proofnet_rg_manifest.py -p no:randomly --tb=short -q

      - name: Upload junit and executed-test floors
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/junit/
          if-no-files-found: error
          retention-days: 30

  lit-real:
    # F31 (LIT memo item 8; packaging_requests 2026-08-28, landed by D05): the
    # first CI leg that ever INSTALLS the LIT bridge's real dependency. lit-nlp
    # 1.3.x requires numpy<2, so the leg pins numpy 1.26.4 (the floor pin the
    # tests.yml floor rows already run). tests/test_lit_bridge_real.py loads
    # its tiny checkpoints OFFLINE and skips when they are not cached, so the
    # cache is warmed FIRST -- a skip cascade would otherwise pass the PASSED
    # floor check as red, never as green. The [lit,hf] and [lit,shap]
    # COMBINATIONS are resolved on every advertised interpreter (the extras
    # gate resolves single extras only): lit-nlp 1.3 requires
    # shap>=0.42,<0.46 and the shap extra admits shap>=0.45.1, so [lit,shap]
    # resolves to the 0.45 line.
    name: LIT bridge (real lit-nlp)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No uv.lock: key the uv cache on the dependency declarations.
          cache-dependency-glob: "pyproject.toml"

      - name: Resolve the [lit,hf] and [lit,shap] combinations on every advertised interpreter
        run: |
          printf 'numpy==1.26.4\n' > "${{ runner.temp }}/numpy1.txt"
          for pv in 3.10 3.11 3.12 3.13; do
            uv pip compile pyproject.toml --extra lit --extra hf -c "${{ runner.temp }}/numpy1.txt" \
              --python-version "$pv" --no-header -q -o "${{ runner.temp }}/lit-hf-$pv.txt"
            echo "[lit,hf] resolves on $pv"
            # set -e fails the step if [lit,shap] stops resolving.
            uv pip compile pyproject.toml --extra lit --extra shap -c "${{ runner.temp }}/numpy1.txt" \
              --python-version "$pv" --no-header -q -o "${{ runner.temp }}/lit-shap-$pv.txt"
            grep -E '^shap==0\.45\.' "${{ runner.temp }}/lit-shap-$pv.txt"
            echo "[lit,shap] resolves on $pv"
          done

      - name: Install lit-nlp + transformers on numpy 1.x
        run: |
          # --index-strategy unsafe-best-match rationale (R61, reviewed): both indexes are reputable and the torch pins are exact `==X+cpu` local versions only the torch index serves, so cross-index confusion cannot select a different name/version; first-index would break resolving torch's +cpu artifacts alongside PyPI deps.
          uv pip install --system -c .github/workflows/numpy1-constraints.txt \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,lit,hf]" \
            "torch==2.13.0+cpu" \
            "numpy==1.26.4"
          uv pip check
          python -c 'import importlib.metadata, lit_nlp, numpy, transformers; assert numpy.__version__.startswith("1."), numpy.__version__; print("lit-nlp", importlib.metadata.version("lit-nlp"), "transformers", transformers.__version__)'

      - name: Warm the tiny-checkpoint cache (the test file itself runs OFFLINE)
        run: |
          python - <<'PY'
          from transformers import AutoModelForCausalLM, AutoModelForSequenceClassification, AutoTokenizer
          for name, cls in (
              ("hf-internal-testing/tiny-random-distilbert", AutoModelForSequenceClassification),
              ("sshleifer/tiny-gpt2", AutoModelForCausalLM),
          ):
              AutoTokenizer.from_pretrained(name)
              cls.from_pretrained(name)
              print("cached", name)
          PY

      - name: Real-LIT gates (PASSED-count attested)
        run: |
          pytest tests/test_lit_bridge_real.py tests/test_lit_bridge_contract.py \
            -p no:randomly --tb=short -q --junitxml="${{ runner.temp }}/junit/lit.junit.xml"
          echo "lit.junit.xml 0 --min-passed 16" >> "${{ runner.temp }}/junit/legs.floor"

      - name: Upload junit and executed-test floors
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/junit/
          if-no-files-found: error
          retention-days: 30

  bridges-real:
    # Real-package bridge legs (round-2 walk bridge fix, 2026-10-05): every
    # tests/test_bridge_real_*.py file importorskips its package, so without a
    # leg that INSTALLS the package each file skips everywhere and a green run
    # covers nothing. One leg per co-installable set; each compares the bridge
    # with the package used directly and attests a PASSED floor so a skip
    # cascade fails red. Tiny checkpoints are warmed first because the files
    # run offline and skip when the checkpoint is not cached.
    name: Bridge real-package (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: vision
            extras: "dev,gradcam,shap,captum"
            pkgs: "torchvision"
            files: "tests/test_bridge_real_gradcam.py tests/test_bridge_real_captum.py tests/test_bridge_real_shap.py tests/test_bridge_real_profiler.py"
            floor: "15"
          - leg: steer
            extras: "dev,steering,dialz"
            pkgs: "transformers"
            files: "tests/test_bridge_real_steering_vectors.py tests/test_bridge_real_dialz.py"
            floor: "13"
          - leg: repeng
            extras: "dev,repeng"
            pkgs: "transformers"
            files: "tests/test_bridge_real_repeng.py"
            # Floor = every row in the file (3 converter rows + 1 layer/model-type row).
            # The former 6 counted the control_vector() trainer rows, removed when the
            # bridge became a thin converter of the native direction (U46.2).
            floor: "4"
          - leg: interop
            extras: "dev,depyf,inseq"
            pkgs: "transformers"
            files: "tests/test_bridge_real_depyf.py tests/test_bridge_real_inseq.py tests/test_b2_bridge_inseq.py"
            # Floor = every row in the three files (depyf 2 + inseq 3 + b2 inseq 4).
            # The former 7 counted the nnsight file's 2 rows, deleted with its
            # bridge and extra (U13.2); the b2 inseq file is new real-package coverage.
            floor: "9"
          - leg: track
            extras: "dev,trackers-relay-test"
            pkgs: "mlflow pandas"
            files: "tests/test_export_real_mlflow.py tests/test_trackers_real_wandb_sink.py tests/test_trackers_sinks_relay_pins.py"
            floor: "5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No uv.lock: key the uv cache on the dependency declarations.
          cache-dependency-glob: "pyproject.toml"

      - name: Install the leg's extras on CPU torch
        env:
          EXTRAS: ${{ matrix.extras }}
          PKGS: ${{ matrix.pkgs }}
        run: |
          # --index-strategy unsafe-best-match rationale (R61, reviewed): both indexes are reputable and the torch pins are exact `==X+cpu` local versions only the torch index serves, so cross-index confusion cannot select a different name/version; first-index would break resolving torch's +cpu artifacts alongside PyPI deps.
          # shellcheck disable=SC2086
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[$EXTRAS]" "torch==2.13.0+cpu" $PKGS

      - name: Warm the tiny-checkpoint cache (the test files run OFFLINE)
        if: matrix.leg == 'steer' || matrix.leg == 'repeng' || matrix.leg == 'interop'
        run: |
          python - <<'PY'
          from transformers import AutoModelForCausalLM, AutoTokenizer
          for name in ("hf-internal-testing/tiny-random-LlamaForCausalLM", "hf-internal-testing/tiny-random-gpt2"):
              AutoTokenizer.from_pretrained(name)
              AutoModelForCausalLM.from_pretrained(name)
              print("cached", name)
          PY

      - name: Real-package bridge gates (PASSED-count attested)
        env:
          FILES: ${{ matrix.files }}
          FLOOR: ${{ matrix.floor }}
          WANDB_MODE: offline
        run: |
          # shellcheck disable=SC2086
          pytest $FILES -p no:randomly --tb=short -q --junitxml="${{ runner.temp }}/junit/bridges.junit.xml"
          echo "bridges.junit.xml 0 --min-passed $FLOOR" >> "${{ runner.temp }}/junit/legs.floor"

      - name: Upload junit and executed-test floors
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/junit/
          if-no-files-found: error
          retention-days: 30

  peer-recipes:
    # The executed recipe pages (tests/test_recipe_pages_executed.py) skip a
    # third-party page when its tool is not installed, so every other leg runs
    # only the TorchLens-only pages. This leg installs every peer at the
    # version its page pins, sets TORCHLENS_RECIPE_PEERS=1 so a missing tool
    # fails instead of skipping, and fails on any skip. torch, transformers
    # and torchvision are held at the versions the base install resolved, so
    # no peer can move them. The base install is the enforcing smoke row
    # (py3.10, torch 2.13.0). LXT (the LRP recipe) is Clear BSD licensed,
    # which permits this CI use.
    name: Recipe pages with every peer installed
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No uv.lock: key the uv cache on the dependency declarations.
          cache-dependency-glob: "pyproject.toml"

      - name: Install graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          # Rank layout renders with neato -n; fail here if this Graphviz lacks it.
          echo 'graph { a -- b }' | neato -Tsvg > /dev/null

      - name: Install the enforcing smoke row's environment
        run: |
          uv venv "$RUNNER_TEMP/peer-venv" --python 3.10
          # --index-strategy unsafe-best-match rationale: both indexes are reputable and the torch pins are exact `==X+cpu` local versions only the torch index serves, so cross-index confusion cannot select a different name/version; first-index would break resolving torch's +cpu artifacts alongside PyPI deps.
          uv pip install --python "$RUNNER_TEMP/peer-venv/bin/python" \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,tabular,viz]" \
            "torch==2.13.0+cpu" \
            "torchvision==0.28.0+cpu" \
            numpy \
            "pydot==4.0.1" \
            "graphviz==0.21" \
            "transformers==5.18.0"

      - name: Install every recipe peer at its page's pin
        run: |
          PY="$RUNNER_TEMP/peer-venv/bin/python"
          TV=$("$PY" -c 'import torch; print(torch.__version__.split("+")[0])')
          TF=$("$PY" -c 'import transformers; print(transformers.__version__)')
          TVV=$("$PY" -c 'import torchvision; print(torchvision.__version__.split("+")[0])')
          uv pip install --python "$PY" \
            weightwatcher==0.7.7 powerlaw==2.0.0 quantus==0.6.0 \
            opencv-python==5.0.0.93 scikit-image==0.25.2 cachetools==7.2.1 \
            himalaya==0.4.11 scikit-learn==1.7.2 scipy==1.15.3 \
            sae-lens==6.54.0 eai-sparsify==1.3.3 "nnsight>=0.6" wandb \
            timm fancy-einsum "open_clip_torch==3.3.0" line_profiler \
            "netrep @ git+https://github.com/ahwillia/netrep@0186b8a77ec1ebaf541cc8f7173cb2556df8a8f0" \
            "torch==$TV" "transformers==$TF" "torchvision==$TVV"
          # These declare dependencies that would move torch, transformers or
          # numpy (torchcam pins numpy<2); their pages install them with
          # --no-deps too. dictionary_learning and ViT-Prisma would pull vllm
          # or a transformers ceiling.
          uv pip install --python "$PY" --no-deps \
            tuned-lens==0.2.0 \
            torchcam==0.4.0 \
            "dictionary_learning @ git+https://github.com/science-of-finetuning/crosscoder_learning@d1fd6f3fea41fc1123699cc09f4cdad47ca35160" \
            "vit-prisma @ git+https://github.com/Prisma-Multimodal/ViT-Prisma@771494b8181a0f7779fab19adb5342688f95c724" \
            "cornet @ git+https://github.com/dicarlolab/CORnet@d0cc17d4b34ad44dedb01683b70eafd15515adad" \
            "lxt @ git+https://github.com/rachtibat/LRP-eXplains-Transformers@f04344177551bfcc3665e88afe96501f43fe560b"
          uv pip freeze --python "$PY" > "$RUNNER_TEMP/peer-freeze.txt"
          cat "$RUNNER_TEMP/peer-freeze.txt"

      - name: Run the recipe pages with the peers required
        env:
          TORCHLENS_RECIPE_PEERS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          "$RUNNER_TEMP/peer-venv/bin/python" -m pytest tests/test_recipe_pages_executed.py \
            -rA --tb=short -p no:cacheprovider \
            --junitxml="$RUNNER_TEMP/junit/peer-recipes.junit.xml"

      - name: Declare the executed-test floor (recipe page)
        # A skip counts as a failure on this leg (maximum skipped fraction 0):
        # every page's peer is installed, so a skip means a page went unrun.
        run: |
          echo "peer-recipes.junit.xml 51 0" >> "$RUNNER_TEMP/junit/legs.floor"

      # The SAE export consumers install last and run in their own step: one
      # of them ships a top-level ``tests`` package that shadows the repo's,
      # so nothing that imports from ``tests`` may run after this install.
      - name: Install the SAE export consumers
        run: |
          PY="$RUNNER_TEMP/peer-venv/bin/python"
          TV=$("$PY" -c 'import torch; print(torch.__version__.split("+")[0])')
          TF=$("$PY" -c 'import transformers; print(transformers.__version__)')
          TVV=$("$PY" -c 'import torchvision; print(torchvision.__version__.split("+")[0])')
          uv pip install --python "$PY" \
            "dataclasses-json>=0.6.4,<0.7" "eindex-callum>=0.1.0,<0.2" \
            matplotlib "typer<0.13" orjson fire blobfile faiss-cpu sentence-transformers \
            asyncer aiofiles "anyio>=4.8.0" \
            "torch==$TV" "transformers==$TF" "torchvision==$TVV"
          # Their declared dependencies would pull vllm or a transformers ceiling.
          uv pip install --python "$PY" --no-deps \
            sae-dashboard==0.8.0 \
            eai-delphi==0.1.3
          uv pip freeze --python "$PY" > "$RUNNER_TEMP/peer-consumers-freeze.txt"

      - name: Run the SAE export consumers
        env:
          OMP_NUM_THREADS: "1"
        run: |
          "$RUNNER_TEMP/peer-venv/bin/python" -m pytest tests/test_bridge_real_sae_export.py \
            -rA --tb=short -p no:cacheprovider \
            --junitxml="$RUNNER_TEMP/junit/peer-consumers.junit.xml"

      - name: Declare the executed-test floor (SAE export consumer)
        run: |
          echo "peer-consumers.junit.xml 4 0" >> "$RUNNER_TEMP/junit/legs.floor"

      - name: Upload the peer freeze and junit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-peer-recipes
          path: |
            ${{ runner.temp }}/peer-freeze.txt
            ${{ runner.temp }}/peer-consumers-freeze.txt
          retention-days: 30

      - name: Upload junit and executed-test floors
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/junit/
          if-no-files-found: error
          retention-days: 30

