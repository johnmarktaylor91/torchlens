name: Quality

on:
  workflow_call:
  pull_request:
    branches: [main]

# Default-deny token scope (grind r3, R61/b2:D1): every job in this
# workflow only reads the repo, so the GITHUB_TOKEN gets exactly that.
permissions:
  contents: read

concurrency:
  group: "${{ github.head_ref || github.ref }}-quality"
  cancel-in-progress: true

jobs:
  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install dependencies
        run: |
          # --index-strategy unsafe-best-match rationale (R61, reviewed): both indexes are reputable and the torch pins are exact `==X+cpu` local versions only the torch index serves, so cross-index confusion cannot select a different name/version; first-index would break resolving torch's +cpu artifacts alongside PyPI deps.
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev]" \
            "torch==2.13.0+cpu"
          uv pip check
          python -c 'import torch; assert torch.__version__ == "2.13.0+cpu"; print(torch.__version__)'

      - name: Run mypy
        run: mypy torchlens/

  packaging:
    name: Packaging manifest tripwires
    runs-on: ubuntu-24.04
    # PR-BLOCKING copy of the wheel-diet + sdist-governance gates (grind r3,
    # R82): they previously ran only in the nightly wheel job, so a revert of
    # the MANIFEST.in / exclude-package-data wiring merged green and shipped
    # for up to a day before the scheduled leg went red. Both tests build the
    # real artifacts (~2 min), well inside the PR budget.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install dependencies
        run: |
          # --index-strategy unsafe-best-match rationale (R61, reviewed): both indexes are reputable and the torch pins are exact `==X+cpu` local versions only the torch index serves, so cross-index confusion cannot select a different name/version; first-index would break resolving torch's +cpu artifacts alongside PyPI deps.
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,tabular]" \
            "torch==2.13.0+cpu"
          uv pip check

      - name: Run the packaging manifest tripwires
        run: |
          pytest \
            "tests/test_packaging_diet.py::test_built_wheel_manifest_is_diet" \
            "tests/test_ci_packaging_gates.py::test_built_sdist_manifest_is_governed" \
            --tb=short -q

  dep-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install dependencies
        # pip>=26.1 and setuptools>=83 are installed EXPLICITLY so both
        # previously suppressed advisories are FIXED in the audited
        # environment instead of ignored (grind r3, R61/b2:B5):
        #   * CVE-2026-3219 (pip < 26.1: concatenated zip/tar confusion) --
        #     the runner-image pip is upgraded to the fixed release.
        #   * PYSEC-2026-3447 (setuptools < 83: MANIFEST.in exclude Unicode-
        #     normalization bypass packs NFD-named files into sdists) -- this
        #     targets exactly this project's MANIFEST-governed sdist path, so
        #     it was never a justifiable suppression; the build-system floor
        #     in pyproject.toml is raised to match.
        run: |
          # --index-strategy unsafe-best-match rationale (R61, reviewed): both indexes are reputable and the torch pins are exact `==X+cpu` local versions only the torch index serves, so cross-index confusion cannot select a different name/version; first-index would break resolving torch's +cpu artifacts alongside PyPI deps.
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e . \
            "torch==2.13.0+cpu" \
            "pip-audit==2.10.1" \
            "pip>=26.1" \
            "setuptools>=83"
          uv pip check
          python -c 'import torch; assert torch.__version__ == "2.13.0+cpu"; print(torch.__version__)'

      - name: Run pip-audit
        # NO suppressions: both former --ignore-vuln entries are resolved by
        # installing the fixed releases above. A new advisory must be FIXED or
        # get a justified, expiring suppression reviewed by the owner -- never
        # an inherited unexplained ignore.
        run: pip-audit

      - name: Audit the release lock (token-bearing path)
        # R61 (b2-opus): the hash-locked stack that runs with the repo-write
        # App token was outside the only vulnerability gate -- a CVE in
        # requests/urllib3/jinja2 inside the release env was invisible to CI.
        # release-requirements.txt is the SINGLE pin authority: build_command
        # installs nothing inside the token scope.
        run: |
          pip-audit -r .github/workflows/release-requirements.txt --disable-pip

  dep-audit-extras:
    # The core job above audits only `-e .` — nothing audited the dev/test/
    # tabular trees that actually pull transformers, timm, lightning,
    # sentence-transformers, etc., so the job's verdict was narrower than
    # "Dependency audit" implies (grind r5, b10 R83-2). Same pins, same
    # no-suppression policy, extras tree.
    name: Dependency audit (extras)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install dependencies with test extras
        run: |
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,test,tabular]" \
            "torch==2.13.0+cpu" \
            "pip-audit==2.10.1" \
            "pip>=26.1" \
            "setuptools>=83"
          uv pip check

      - name: Run pip-audit over the extras tree
        run: pip-audit
