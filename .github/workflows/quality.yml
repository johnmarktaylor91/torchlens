name: Quality

on:
  workflow_call:
  pull_request:
    branches: [main]

concurrency:
  group: "${{ github.head_ref || github.ref }}-quality"
  cancel-in-progress: true

jobs:
  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev]" \
            "torch==2.13.0+cpu"
          uv pip check
          python -c 'import torch; assert torch.__version__ == "2.13.0+cpu"; print(torch.__version__)'

      - name: Run mypy
        run: mypy torchlens/

  dep-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e . \
            "torch==2.13.0+cpu" \
            "pip-audit==2.10.1"
          uv pip check
          python -c 'import torch; assert torch.__version__ == "2.13.0+cpu"; print(torch.__version__)'

      - name: Run pip-audit
        # CVE-2026-3219 affects pip itself (the package installed on
        # the GitHub runner image). It's outside this project's
        # dependency surface and not actionable from pyproject.toml.
        # Ignore that single ID; remove this once a pip release with
        # the fix is generally available.
        run: pip-audit --ignore-vuln CVE-2026-3219 --ignore-vuln PYSEC-2026-3447
