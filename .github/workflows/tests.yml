name: Tests

on:
  workflow_call:
  pull_request:
    branches: [main]

# Default-deny token scope (grind r3, R61/b2:D1): every job in this
# workflow only reads the repo, so the GITHUB_TOKEN gets exactly that.
permissions:
  contents: read

concurrency:
  group: "${{ github.head_ref || github.ref }}-tests"
  cancel-in-progress: true

jobs:
  smoke:
    # NO event-name guard here (grind r5, b10 R82-1): inside a reusable
    # workflow `github.event_name` is the CALLER's event, so a former
    # `if: pull_request || push` condition meant that adding
    # `workflow_dispatch:`/`schedule:` to release.yml would SKIP every test
    # row while the called workflow still reported SUCCESS to
    # `needs: [tests]` — a release with zero tests executed. Duplicate runs
    # are already handled by the concurrency group above.
    name: ${{ matrix.track }} (torch ${{ matrix.torch }}, py ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Required rows use exact admitted CPU pairs. Ecosystem drift is isolated
        # to the separate scheduled/manual latest-canary workflow.
        include:
          - track: floor
            python: "3.10"
            torch: "2.1.2+cpu"
            torchvision: "0.16.2+cpu"
            numpy: "numpy==1.26.4"
            scope: smoke
          - track: floor
            python: "3.11"
            torch: "2.1.2+cpu"
            torchvision: "0.16.2+cpu"
            numpy: "numpy==1.26.4"
            scope: smoke
          # r7 R85-1: pyproject declares THREE python-conditioned torch
          # floors (>=2.1 for py<3.12, >=2.2 for py3.12, >=2.6 for py3.13)
          # but CI exercised only the first — the 3.12/3.13 claims were
          # asserted in metadata and executed nowhere. These two rows run
          # each conditioned floor on exactly the interpreter that declares
          # it.
          - track: floor
            python: "3.12"
            torch: "2.2.2+cpu"
            torchvision: "0.17.2+cpu"
            numpy: "numpy==1.26.4"
            scope: smoke
          - track: floor
            python: "3.13"
            torch: "2.6.0+cpu"
            torchvision: "0.21.0+cpu"
            numpy: numpy
            scope: smoke
          - track: canonical
            python: "3.10"
            torch: "2.8.0+cpu"
            torchvision: "0.23.0+cpu"
            numpy: numpy
            scope: smoke
          - track: canonical
            python: "3.11"
            torch: "2.8.0+cpu"
            torchvision: "0.23.0+cpu"
            numpy: numpy
            scope: smoke
            # ONE gating row runs with pytest-randomly installed (grind r4,
            # reopened R76/3.16.4: the plugin was declared in the [test]
            # extra but no release-gating leg installed it, so the
            # order-isolation guards skipped on every PR and randomized-order
            # coverage existed only on scheduled legs). This row's smoke run
            # shuffles under a fresh seed each run -- the seed prints in the
            # pytest header for reproduction -- while the other five rows
            # stay definition-ordered.
            randomized: "1"
          - track: newest-admitted
            python: "3.10"
            torch: "2.13.0+cpu"
            torchvision: "0.28.0+cpu"
            numpy: numpy
            scope: smoke
            # This row's environment matches the byte-oracle goldens' committed
            # ENV marker (tests/*/goldens/ENV), so it is the ONE leg where the
            # golden families enforce. The declaration turns every oracle skip
            # into a hard failure: a matrix bump here without a deliberate
            # golden rebaseline goes red instead of silently skipping all
            # golden cases (T13.1). Lockstep with the ENV markers is pinned by
            # tests/test_ci_packaging_gates.py.
            oracle_enforce: "1"
            # DOT-byte enforcement of the render-identity oracle runs here too:
            # the byte golden was recorded on this same py3.10 environment (the
            # byte compare is sensitive to py-minor qualname drift). The flag
            # previously sat on a row whose smoke selection never runs the
            # heavy-marked consumer test, so byte identity was enforced on NO
            # CI leg (T13.2); a dedicated step below executes it explicitly.
            render_byte_oracle: "1"
          - track: newest-admitted
            python: "3.11"
            torch: "2.13.0+cpu"
            torchvision: "0.28.0+cpu"
            numpy: numpy
            scope: smoke
          - track: newest-admitted
            python: "3.12"
            torch: "2.13.0+cpu"
            torchvision: "0.28.0+cpu"
            numpy: numpy
            scope: smoke
            # Python >= 3.12 is advertised support AND selects the
            # sys.monitoring escape-detection path, which no 3.10/3.11 row can
            # execute. Before this row existed the path had NO CI coverage and
            # its only >=3.12-gated unit test had rotted unnoticed (T13.4).
          - track: newest-admitted
            python: "3.13"
            torch: "2.13.0+cpu"
            torchvision: "0.28.0+cpu"
            numpy: numpy
            scope: smoke
            # Python 3.13 was the last classifier-advertised interpreter with
            # ZERO test execution anywhere in CI — its only appearance was
            # nightly's resolution-only `uv pip compile` loop, which imports
            # nothing (grind r5, b10 R85-1). The classifier<->matrix lockstep
            # test in tests/test_ci_packaging_gates.py now requires a real
            # row per advertised interpreter, so dropping this row goes red.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install exact CPU test environment
        env:
          TORCH_VERSION: ${{ matrix.torch }}
          TORCHVISION_VERSION: ${{ matrix.torchvision }}
          NUMPY_SPEC: ${{ matrix.numpy }}
        run: |
          # --index-strategy unsafe-best-match rationale (R61, reviewed): both indexes are reputable and the torch pins are exact `==X+cpu` local versions only the torch index serves, so cross-index confusion cannot select a different name/version; first-index would break resolving torch's +cpu artifacts alongside PyPI deps.
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,tabular]" \
            "torch==${TORCH_VERSION}" \
            "torchvision==${TORCHVISION_VERSION}" \
            "${NUMPY_SPEC}" \
            "pydot==4.0.1" \
            "graphviz==0.21"

      - name: Arm randomized test ordering (order-isolation gate row)
        if: matrix.randomized == '1'
        # Exact pin, matching the release-gating pin discipline; the [test]
        # extra declares the plugin unpinned for contributors, and the
        # scheduled .[test] legs resolve it freely.
        run: uv pip install --system "pytest-randomly==4.1.0"

      - name: Validate installed environment
        env:
          TORCH_VERSION: ${{ matrix.torch }}
          TORCHVISION_VERSION: ${{ matrix.torchvision }}
        run: |
          uv pip check
          python - <<'PY'
          import os

          import torch
          import torchvision
          from torchvision.ops import nms

          assert torch.__version__ == os.environ["TORCH_VERSION"]
          assert torchvision.__version__ == os.environ["TORCHVISION_VERSION"]
          boxes = torch.tensor([[0.0, 0.0, 1.0, 1.0]])
          scores = torch.tensor([1.0])
          assert nms(boxes, scores, 0.5).tolist() == [0]
          print(torch.__version__, torchvision.__version__)
          PY

      - name: Run smoke tests and compatibility coverage
        if: matrix.scope == 'smoke'
        env:
          TORCHLENS_ORACLE_ENFORCE: ${{ matrix.oracle_enforce }}
        run: |
          # The menagerie build subsystem is excluded from the smoke matrix on
          # BOTH of its trees: tests/test_menagerie_*.py hard-imports pydantic
          # (via menagerie/schema.py), and tests/crawler/ is the menagerie-crawler
          # corpus validated by its own dedicated crawler-round21-* conda-env
          # jobs. Neither dependency set is present in this lean .[dev,tabular]
          # smoke env (pydantic ships only in the .[test] extra), so collecting
          # either tree ModuleNotFoundErrors at import time. tests/conftest.py
          # auto-skips both on Python < 3.11 (menagerie uses datetime.UTC), but
          # that guard is OFF on 3.11, so these explicit --ignore flags are
          # REQUIRED on the 3.11 legs. No smoke coverage is lost (no menagerie or
          # crawler test is smoke-marked).
          pytest tests/ -m smoke --ignore-glob="*menagerie*" --ignore=tests/crawler --tb=short -q \
            --junitxml="${{ runner.temp }}/smoke.junit.xml"
          pytest tests/test_torch_compat.py --tb=short -q

      - name: Fail on an under-executed smoke suite
        if: matrix.scope == 'smoke'
        # Executed-floor attestation on EVERY smoke row (previously only the
        # nightly preview-backend legs had one): a row where collection drift,
        # a conftest guard, or mass importorskip/oracle skipping hollows out
        # the suite must go red, not green. The smoke tier selects ~5,026
        # tests (re-trued 2026-08-16, r7 R41: the old "~3900"/1900 pair had
        # lagged the tier by a thousand tests, tolerating a silent 61% loss);
        # the floor is roughly half so normal churn and per-torch-version
        # skips never trip it, and the 15% skip-fraction bound scales with
        # the selection so the ratchet no longer weakens as the suite grows.
        run: |
          python scripts/check_ci_executed_tests.py "${{ runner.temp }}/smoke.junit.xml" 2500 0.15

      - name: Enforce the render byte oracle
        if: matrix.render_byte_oracle == '1'
        # The byte half of the render-identity oracle is heavy-marked, so the
        # smoke selection never executes it — the historical row-level env
        # flag was dead config and DOT-byte identity ran on NO CI leg (T13.2).
        # Run the consumer test explicitly on the recording-environment row
        # (measured ~6s) and attest that it EXECUTED rather than skipped.
        env:
          TORCHLENS_RENDER_BYTE_ORACLE: "1"
        run: |
          pytest tests/test_viz_render_identity_oracle.py -m heavy --tb=short -q \
            --junitxml="${{ runner.temp }}/render-byte-oracle.junit.xml"
          python scripts/check_ci_executed_tests.py \
            "${{ runner.temp }}/render-byte-oracle.junit.xml" 1

      - name: Enforce the surface byte oracle
        if: matrix.oracle_enforce == '1'
        # The surface-oracle BYTE family (6 per-axis byte tests + the
        # two-subprocess determinism control) is heavy-marked, so this row's
        # smoke selection collects only the 2 fact pins (probe: 2/9), and
        # every scheduled leg that selects heavy runs on a non-canonical
        # environment where require_env_golden legitimately skips — byte
        # identity was enforced on NO CI leg (the T13.2 class recurring one
        # family over, b10 R78 round-4). Run the family explicitly on the ONE
        # enforcing row and attest the byte tests EXECUTED (floor 6 = the six
        # model-axis byte tests; the determinism control also collects).
        env:
          TORCHLENS_ORACLE_ENFORCE: "1"
        run: |
          pytest tests/surface_oracle/ -m heavy --tb=short -q \
            --junitxml="${{ runner.temp }}/surface-byte-oracle.junit.xml"
          python scripts/check_ci_executed_tests.py \
            "${{ runner.temp }}/surface-byte-oracle.junit.xml" 6

  crawler-round21-linux-release:
    name: Crawler Round 21 Linux committed-lock release proofs
    runs-on: ubuntu-latest
    # Opt-in real/self-hosted runner gate. This Linux release proof runs a real
    # bubblewrap-sandboxed composition (build from the committed lock, execute the
    # model, emit a pass attestation). GitHub's hosted ubuntu runners cannot run
    # that composition faithfully, so it is gated on the repository variable
    # MENAGERIE_RELEASE_RUNNERS. Set it to 'true' only where real/self-hosted
    # release runners are configured; until then this job -- and the reversion +
    # conformance jobs that need it -- skip, while torchlens core CI still runs.
    if: ${{ vars.MENAGERIE_RELEASE_RUNNERS == 'true' }}
    env:
      MENAGERIE_RELEASE_GATE: "1"
      MENAGERIE_PLATFORM_LOCK: menagerie/crawler/envs/locks/round19-linux-64.lock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve round21 runner-temp attestation paths
        shell: bash
        run: |
          echo "MENAGERIE_REAL_ENV_PREFIX=$RUNNER_TEMP/round21-linux-prefix" >> "$GITHUB_ENV"
          echo "MENAGERIE_RELEASE_ATTESTATION=$RUNNER_TEMP/round21-linux-attestation.json" >> "$GITHUB_ENV"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3.3.0
        with:
          auto-activate-base: false
          python-version: "3.11"

      - name: Require Linux lock, provenance, conda, bwrap, and strace
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap strace
          # GitHub's ubuntu-24.04 runners restrict unprivileged user namespaces
          # (AppArmor), so an installed bwrap still cannot construct its sandbox and
          # detect_os_sandbox() fails closed at the release gate. Re-enable userns for
          # the sandbox probe when the runner exposes each knob. A present knob must
          # apply successfully; an absent optional knob is reported explicitly.
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "Optional sysctl kernel.apparmor_restrict_unprivileged_userns is unavailable"
          fi
          if test -e /proc/sys/kernel/unprivileged_userns_clone; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          else
            echo "Optional sysctl kernel.unprivileged_userns_clone is unavailable"
          fi
          for artifact in \
            "$MENAGERIE_PLATFORM_LOCK" \
            "${MENAGERIE_PLATFORM_LOCK%.lock}.resolved.json" \
            "${MENAGERIE_PLATFORM_LOCK%.lock}.resolved.sha256" \
            "${MENAGERIE_PLATFORM_LOCK%.lock}.provenance.json" \
            "${MENAGERIE_PLATFORM_LOCK%.lock}.probes.json"; do
            if [ ! -f "$artifact" ]; then
              echo "unmet-release-gate: missing committed Linux artifact: $artifact"
              exit 1
            fi
          done
          if ! command -v conda >/dev/null 2>&1; then
            echo "unmet-release-gate: conda is unavailable on the Linux release host"
            exit 1
          fi
          if ! command -v bwrap >/dev/null 2>&1 || ! command -v strace >/dev/null 2>&1; then
            echo "unmet-release-gate: Linux bwrap/strace enforcement is unavailable"
            exit 1
          fi

      - name: Materialize and verify the committed SHA-256 Linux lock
        shell: bash
        run: |
          # Exact pin in a release-gating job (grind r4, R83): a free-resolving
          # jsonschema can change lock-validation verdicts between runs. Kept
          # inside the dev extra's jsonschema>=4.18,<5 band.
          python -m pip install "jsonschema==4.26.0"
          PYTHONPATH=. python -m menagerie.crawler.tools.release_lock \
            --lock "$MENAGERIE_PLATFORM_LOCK" \
            --resolved-export "${MENAGERIE_PLATFORM_LOCK%.lock}.resolved.json" \
            --prefix "$MENAGERIE_REAL_ENV_PREFIX" \
            --conda conda
          "$MENAGERIE_REAL_ENV_PREFIX/bin/python" -c \
            "import jsonschema, numpy, pytest, torch"

      - name: Run every registered Linux real composition and emit pass attestation
        shell: bash
        run: |
          PYTHONPATH=. "$MENAGERIE_REAL_ENV_PREFIX/bin/python" -m pytest -q \
            menagerie/crawler/tests -m round21_linux_real -x --tb=short
          "$MENAGERIE_REAL_ENV_PREFIX/bin/python" -c \
            "import json, os; p=json.load(open(os.environ['MENAGERIE_RELEASE_ATTESTATION'])); assert p['status']=='passed' and p['expected_nodes']==p['passed_nodes'] and not p['skipped_nodes'] and not p['xfailed_nodes']"

      - name: Upload Linux release pass attestation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: round21-linux-release-attestation
          path: ${{ runner.temp }}/round21-linux-attestation.json
          if-no-files-found: error

  crawler-round21-macos-release:
    name: Crawler Round 21 macOS committed-lock Seatbelt release proofs
    runs-on: macos-14-xlarge
    # Opt-in real/self-hosted runner gate (shared with the Linux release proof via
    # MENAGERIE_RELEASE_RUNNERS). GitHub does not provision the macos-14-xlarge
    # Apple-Silicon runner for this repo, and the Seatbelt attestation needs a real
    # macOS host, so this is gated. Set MENAGERIE_RELEASE_RUNNERS='true' (with a
    # provisioned Apple-Silicon runner) to enable it plus the cross-host
    # conformance gate that consumes its artifact.
    if: ${{ vars.MENAGERIE_RELEASE_RUNNERS == 'true' }}
    env:
      MENAGERIE_RELEASE_GATE: "1"
      MENAGERIE_PLATFORM_LOCK: menagerie/crawler/envs/locks/round19-osx-arm64.lock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve round21 runner-temp attestation paths
        shell: bash
        run: |
          echo "MENAGERIE_REAL_ENV_PREFIX=$RUNNER_TEMP/round21-macos-prefix" >> "$GITHUB_ENV"
          echo "MENAGERIE_RELEASE_ATTESTATION=$RUNNER_TEMP/round21-macos-attestation.json" >> "$GITHUB_ENV"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3.3.0
        with:
          auto-activate-base: false
          python-version: "3.11"

      - name: Require macOS lock, provenance, conda, and Seatbelt denial audit
        shell: bash
        run: |
          if [ "$(uname -s)" != "Darwin" ] || [ "$(uname -m)" != "arm64" ]; then
            echo "unmet-release-gate: an Apple-Silicon macOS release host is required"
            exit 1
          fi
          for artifact in \
            "$MENAGERIE_PLATFORM_LOCK" \
            "${MENAGERIE_PLATFORM_LOCK%.lock}.resolved.json" \
            "${MENAGERIE_PLATFORM_LOCK%.lock}.resolved.sha256" \
            "${MENAGERIE_PLATFORM_LOCK%.lock}.provenance.json" \
            "${MENAGERIE_PLATFORM_LOCK%.lock}.probes.json"; do
            if [ ! -f "$artifact" ]; then
              echo "unmet-release-gate: missing committed macOS artifact: $artifact"
              exit 1
            fi
          done
          if ! command -v conda >/dev/null 2>&1; then
            echo "unmet-release-gate: conda is unavailable on the macOS release host"
            exit 1
          fi
          if ! command -v sandbox-exec >/dev/null 2>&1 || ! command -v log >/dev/null 2>&1; then
            echo "unmet-release-gate: seatbelt-denial-audit-unavailable"
            exit 1
          fi

      - name: Materialize and verify the committed SHA-256 macOS lock
        shell: bash
        run: |
          # Exact pin in a release-gating job (grind r4, R83): a free-resolving
          # jsonschema can change lock-validation verdicts between runs. Kept
          # inside the dev extra's jsonschema>=4.18,<5 band.
          python -m pip install "jsonschema==4.26.0"
          PYTHONPATH=. python -m menagerie.crawler.tools.release_lock \
            --lock "$MENAGERIE_PLATFORM_LOCK" \
            --resolved-export "${MENAGERIE_PLATFORM_LOCK%.lock}.resolved.json" \
            --prefix "$MENAGERIE_REAL_ENV_PREFIX" \
            --conda conda
          "$MENAGERIE_REAL_ENV_PREFIX/bin/python" -c \
            "import jsonschema, numpy, pytest, torch"

      - name: Run every registered macOS real composition and emit pass attestation
        shell: bash
        run: |
          PYTHONPATH=. "$MENAGERIE_REAL_ENV_PREFIX/bin/python" -m pytest -q \
            menagerie/crawler/tests -m round21_macos_real -x --tb=short
          "$MENAGERIE_REAL_ENV_PREFIX/bin/python" -c \
            "import json, os; p=json.load(open(os.environ['MENAGERIE_RELEASE_ATTESTATION'])); assert p['status']=='passed' and p['expected_nodes']==p['passed_nodes'] and not p['skipped_nodes'] and not p['xfailed_nodes']"

      - name: Upload macOS release pass attestation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: round21-macos-release-attestation
          path: ${{ runner.temp }}/round21-macos-attestation.json
          if-no-files-found: error

  crawler-round21-deliberate-reversions:
    name: Crawler Round 21 deliberate reversion gates
    runs-on: ubuntu-latest
    needs:
      # Linux reversions do not need the (opt-in) macOS release job; depending on
      # it would make this Linux gate skip whenever the macOS runner is absent.
      - crawler-round21-linux-release
    env:
      MENAGERIE_RELEASE_GATE: "1"
      MENAGERIE_PLATFORM_LOCK: menagerie/crawler/envs/locks/round19-linux-64.lock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve round21 runner-temp attestation paths
        shell: bash
        run: |
          echo "MENAGERIE_REAL_ENV_PREFIX=$RUNNER_TEMP/round21-reversion-prefix" >> "$GITHUB_ENV"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3.3.0
        with:
          auto-activate-base: false
          python-version: "3.11"

      - name: Materialize and verify the committed SHA-256 Linux lock
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap strace
          # GitHub's ubuntu-24.04 runners restrict unprivileged user namespaces
          # (AppArmor), so an installed bwrap still cannot construct its sandbox and
          # detect_os_sandbox() fails closed at the release gate. Re-enable userns for
          # the sandbox probe when the runner exposes each knob. A present knob must
          # apply successfully; an absent optional knob is reported explicitly.
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "Optional sysctl kernel.apparmor_restrict_unprivileged_userns is unavailable"
          fi
          if test -e /proc/sys/kernel/unprivileged_userns_clone; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          else
            echo "Optional sysctl kernel.unprivileged_userns_clone is unavailable"
          fi
          # Exact pin in a release-gating job (grind r4, R83): a free-resolving
          # jsonschema can change lock-validation verdicts between runs. Kept
          # inside the dev extra's jsonschema>=4.18,<5 band.
          python -m pip install "jsonschema==4.26.0"
          PYTHONPATH=. python -m menagerie.crawler.tools.release_lock \
            --lock "$MENAGERIE_PLATFORM_LOCK" \
            --resolved-export "${MENAGERIE_PLATFORM_LOCK%.lock}.resolved.json" \
            --prefix "$MENAGERIE_REAL_ENV_PREFIX" \
            --conda conda
          "$MENAGERIE_REAL_ENV_PREFIX/bin/python" -c \
            "import jsonschema, numpy, pytest, torch"

      - name: Run every D01-D29 disposable-checkout reversion
        shell: bash
        run: |
          PYTHONPATH=. "$MENAGERIE_REAL_ENV_PREFIX/bin/python" -m menagerie.crawler.tools.round21_reversions \
            --source "$GITHUB_WORKSPACE" \
            --work-root "${{ runner.temp }}/round21-reversions" \
            --attestation "${{ runner.temp }}/round21-reversion-attestation.json"

      - name: Upload deliberate-reversion result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: round21-reversion-attestation
          path: ${{ runner.temp }}/round21-reversion-attestation.json
          if-no-files-found: error

  crawler-round21-conformance:
    name: Crawler Round 21 conformance totality and pass attestation
    runs-on: ubuntu-latest
    needs:
      - crawler-round21-linux-release
      - crawler-round21-macos-release
      - crawler-round21-deliberate-reversions
    env:
      MENAGERIE_RELEASE_GATE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve round21 runner-temp attestation paths
        shell: bash
        run: |
          {
            echo "MENAGERIE_LINUX_RELEASE_ATTESTATION=$RUNNER_TEMP/round21-attestations/linux/round21-linux-attestation.json"
            echo "MENAGERIE_MACOS_RELEASE_ATTESTATION=$RUNNER_TEMP/round21-attestations/macos/round21-macos-attestation.json"
            echo "MENAGERIE_REVERSION_ATTESTATION=$RUNNER_TEMP/round21-attestations/reversions/round21-reversion-attestation.json"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: round21-linux-release-attestation
          path: ${{ runner.temp }}/round21-attestations/linux

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: round21-macos-release-attestation
          path: ${{ runner.temp }}/round21-attestations/macos

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: round21-reversion-attestation
          path: ${{ runner.temp }}/round21-attestations/reversions

      - name: Install crawler test dependencies
        run: |
          python -m pip install -e ".[dev,tabular]"

      - name: Prove registry totality and host pass/not-skip coverage
        run: |
          python -m pytest -q \
            menagerie/crawler/tests/test_release_conformance_composition.py::test_ci_attestations_cover_registry_without_skip \
            -x --tb=short
