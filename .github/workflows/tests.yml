name: Tests

on:
  workflow_call:
  pull_request:
    branches: [main]

concurrency:
  group: "${{ github.head_ref || github.ref }}-tests"
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: ${{ matrix.track }} (torch ${{ matrix.torch }}, py ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Required rows use exact admitted CPU pairs. Ecosystem drift is isolated
        # to the separate scheduled/manual latest-canary workflow.
        include:
          - track: floor
            python: "3.10"
            torch: "2.1.2+cpu"
            torchvision: "0.16.2+cpu"
            numpy: "numpy==1.26.4"
            scope: smoke
          - track: floor
            python: "3.11"
            torch: "2.1.2+cpu"
            torchvision: "0.16.2+cpu"
            numpy: "numpy==1.26.4"
            scope: smoke
          - track: canonical
            python: "3.10"
            torch: "2.8.0+cpu"
            torchvision: "0.23.0+cpu"
            numpy: numpy
            scope: smoke
          - track: canonical
            python: "3.11"
            torch: "2.8.0+cpu"
            torchvision: "0.23.0+cpu"
            numpy: numpy
            scope: not-slow
            render_byte_oracle: "1"
          - track: newest-admitted
            python: "3.10"
            torch: "2.13.0+cpu"
            torchvision: "0.28.0+cpu"
            numpy: numpy
            scope: smoke
          - track: newest-admitted
            python: "3.11"
            torch: "2.13.0+cpu"
            torchvision: "0.28.0+cpu"
            numpy: numpy
            scope: smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v5

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install exact CPU test environment
        env:
          TORCH_VERSION: ${{ matrix.torch }}
          TORCHVISION_VERSION: ${{ matrix.torchvision }}
          NUMPY_SPEC: ${{ matrix.numpy }}
        run: |
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,tabular]" \
            "torch==${TORCH_VERSION}" \
            "torchvision==${TORCHVISION_VERSION}" \
            "${NUMPY_SPEC}" \
            "pydot==4.0.1"

      - name: Validate installed environment
        env:
          TORCH_VERSION: ${{ matrix.torch }}
          TORCHVISION_VERSION: ${{ matrix.torchvision }}
        run: |
          uv pip check
          python - <<'PY'
          import os

          import torch
          import torchvision
          from torchvision.ops import nms

          assert torch.__version__ == os.environ["TORCH_VERSION"]
          assert torchvision.__version__ == os.environ["TORCHVISION_VERSION"]
          boxes = torch.tensor([[0.0, 0.0, 1.0, 1.0]])
          scores = torch.tensor([1.0])
          assert nms(boxes, scores, 0.5).tolist() == [0]
          print(torch.__version__, torchvision.__version__)
          PY

      - name: Run smoke tests and compatibility coverage
        if: matrix.scope == 'smoke'
        env:
          TORCHLENS_RENDER_BYTE_ORACLE: ${{ matrix.render_byte_oracle }}
        run: |
          pytest tests/ -m smoke --tb=short -q
          pytest tests/test_torch_compat.py --tb=short -q

      - name: Run non-slow tests
        if: matrix.scope == 'not-slow'
        env:
          TORCHLENS_RENDER_BYTE_ORACLE: ${{ matrix.render_byte_oracle }}
        # menagerie/ is a separate reference corpus (excluded from the wheel and
        # maintained independently); the torchlens package not-slow gate does not run
        # its tests. See tests/test_menagerie_*.py.
        run: pytest tests/ -m "not slow" --ignore-glob='tests/test_menagerie_*.py' --tb=short -q
