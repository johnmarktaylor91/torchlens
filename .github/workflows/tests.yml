name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: "${{ github.head_ref || github.ref }}-tests"
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (torch ${{ matrix.torch }}, py ${{ matrix.python }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # Cover the declared torch floor (2.1, on both supported pythons),
        # the current dev baseline, and the newest installable CPU torch as
        # an early warning signal. Torch 2.1 has no Python 3.12 wheels.
        include:
          - python: "3.11"
            torch: "2.1.*"
            experimental: false
            pytest: 'pytest tests/ -m smoke tests/test_torch_compat.py -x --tb=short -q'
          - python: "3.10"
            torch: "2.1.*"
            experimental: false
            pytest: 'pytest tests/ -m smoke tests/test_torch_compat.py -x --tb=short -q'
          - python: "3.11"
            torch: "2.8.*"
            experimental: false
            pytest: 'pytest tests/ -m "not slow" -x --tb=short -q'
          - python: "3.11"
            torch: "latest"
            experimental: true
            pytest: 'pytest tests/ -m smoke tests/test_torch_compat.py -x --tb=short -q'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v5

      - name: Install graphviz (system dep -- the `dot` binary used by
          tests that render visualization output)
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install torch (${{ matrix.torch }}, CPU wheel)
        run: |
          if [ "${{ matrix.torch }}" = "latest" ]; then
            uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
          else
            uv pip install --system "torch==${{ matrix.torch }}" \
              --index-url https://download.pytorch.org/whl/cpu
          fi

      - name: Install torchlens (with test extras)
        run: |
          uv pip install --system -e ".[dev,tabular]"

      - name: Run smoke tests
        run: |
          ${{ matrix.pytest }}

  crawler-round21-linux-release:
    name: Crawler Round 21 Linux committed-lock release proofs
    runs-on: ubuntu-latest
    env:
      MENAGERIE_RELEASE_GATE: "1"
      MENAGERIE_PLATFORM_LOCK: menagerie/crawler/envs/locks/round19-linux-64.lock
      MENAGERIE_REAL_ENV_PREFIX: ${{ runner.temp }}/round21-linux-prefix
      MENAGERIE_RELEASE_ATTESTATION: ${{ runner.temp }}/round21-linux-attestation.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          python-version: "3.11"

      - name: Require Linux lock, provenance, conda, bwrap, and strace
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap strace
          for artifact in \
            "$MENAGERIE_PLATFORM_LOCK" \
            "${MENAGERIE_PLATFORM_LOCK%.lock}.resolved.json" \
            "${MENAGERIE_PLATFORM_LOCK%.lock}.resolved.sha256" \
            "${MENAGERIE_PLATFORM_LOCK%.lock}.provenance.json" \
            "${MENAGERIE_PLATFORM_LOCK%.lock}.probes.json"; do
            if [ ! -f "$artifact" ]; then
              echo "unmet-release-gate: missing committed Linux artifact: $artifact"
              exit 1
            fi
          done
          if ! command -v conda >/dev/null 2>&1; then
            echo "unmet-release-gate: conda is unavailable on the Linux release host"
            exit 1
          fi
          if ! command -v bwrap >/dev/null 2>&1 || ! command -v strace >/dev/null 2>&1; then
            echo "unmet-release-gate: Linux bwrap/strace enforcement is unavailable"
            exit 1
          fi

      - name: Materialize and verify the committed SHA-256 Linux lock
        shell: bash
        run: |
          python -m pip install jsonschema
          PYTHONPATH=. python -m menagerie.crawler.tools.release_lock \
            --lock "$MENAGERIE_PLATFORM_LOCK" \
            --resolved-export "${MENAGERIE_PLATFORM_LOCK%.lock}.resolved.json" \
            --prefix "$MENAGERIE_REAL_ENV_PREFIX" \
            --conda conda
          "$MENAGERIE_REAL_ENV_PREFIX/bin/python" -c \
            "import jsonschema, numpy, pytest, torch"

      - name: Run every registered Linux real composition and emit pass attestation
        shell: bash
        run: |
          PYTHONPATH=. "$MENAGERIE_REAL_ENV_PREFIX/bin/python" -m pytest -q \
            menagerie/crawler/tests -m round21_linux_real -x --tb=short
          "$MENAGERIE_REAL_ENV_PREFIX/bin/python" -c \
            "import json, os; p=json.load(open(os.environ['MENAGERIE_RELEASE_ATTESTATION'])); assert p['status']=='passed' and p['expected_nodes']==p['passed_nodes'] and not p['skipped_nodes'] and not p['xfailed_nodes']"

      - name: Upload Linux release pass attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round21-linux-release-attestation
          path: ${{ runner.temp }}/round21-linux-attestation.json
          if-no-files-found: error

  crawler-round19-macos-release:
    name: Crawler Round 19 macOS supported-host release gate
    runs-on: macos-14-xlarge
    env:
      MENAGERIE_RELEASE_GATE: "1"
      MENAGERIE_PLATFORM_LOCK: menagerie/crawler/envs/locks/round19-osx-arm64.lock
      MENAGERIE_REAL_ENV_PREFIX: ${{ runner.temp }}/round19-macos-prefix
    steps:
      - uses: actions/checkout@v4

      - name: Provision the exact macOS platform lock
        shell: bash
        run: |
          if [ "$(uname -s)" != "Darwin" ] || [ "$(uname -m)" != "arm64" ]; then
            echo "unmet-release-gate: an Apple-Silicon macOS release host is required"
            exit 1
          fi
          if [ ! -f "$MENAGERIE_PLATFORM_LOCK" ]; then
            echo "unmet-release-gate: missing macOS platform lock: $MENAGERIE_PLATFORM_LOCK"
            exit 1
          fi
          if ! command -v conda >/dev/null 2>&1; then
            echo "unmet-release-gate: conda is unavailable on the macOS release host"
            exit 1
          fi
          if ! command -v sandbox-exec >/dev/null 2>&1 || ! command -v log >/dev/null 2>&1; then
            echo "unmet-release-gate: macOS Seatbelt/denial audit is unavailable"
            exit 1
          fi
          conda create --yes --prefix "$MENAGERIE_REAL_ENV_PREFIX" \
            --file "$MENAGERIE_PLATFORM_LOCK"

      - name: Run exact macOS positive and caught-denial release proofs
        shell: bash
        run: |
          PYTHONPATH=. "$MENAGERIE_REAL_ENV_PREFIX/bin/python" -m pytest -q \
            menagerie/crawler/tests/test_round19_environment_authority_composition.py::test_macos_real_compiler_denies_caught_undeclared_repo_read_and_awards_package \
            menagerie/crawler/tests/test_round19_environment_authority_composition.py::test_macos_v3_profile_has_one_fresh_literal_prefix_and_exact_outside_members \
            menagerie/crawler/tests/test_round19_vs6_dry_run_composition.py::test_documented_dry_run_and_resume_use_real_environment \
            menagerie/crawler/tests/test_round19_vs6_dry_run_composition.py::test_dry_run_all_source_failure_is_acceptance_error \
            -x --tb=short
