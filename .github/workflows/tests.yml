name: Tests

on:
  workflow_call:
  pull_request:
    branches: [main]

# Default-deny token scope (grind r3, R61/b2:D1): every job in this
# workflow only reads the repo, so the GITHUB_TOKEN gets exactly that.
permissions:
  contents: read

concurrency:
  group: "${{ github.head_ref || github.ref }}-tests"
  cancel-in-progress: true

jobs:
  smoke:
    # NO event-name guard here (grind r5, b10 R82-1): inside a reusable
    # workflow `github.event_name` is the CALLER's event, so a former
    # `if: pull_request || push` condition meant that adding
    # `workflow_dispatch:`/`schedule:` to release.yml would SKIP every test
    # row while the called workflow still reported SUCCESS to
    # `needs: [tests]` — a release with zero tests executed. Duplicate runs
    # are already handled by the concurrency group above.
    name: ${{ matrix.track }} (torch ${{ matrix.torch }}, py ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Required rows use exact admitted CPU pairs. Ecosystem drift is isolated
        # to the separate scheduled/manual latest-canary workflow.
        include:
          - track: floor
            python: "3.10"
            torch: "2.1.2+cpu"
            torchvision: "0.16.2+cpu"
            numpy: "numpy==1.26.4"
            scope: smoke
          - track: floor
            python: "3.11"
            torch: "2.1.2+cpu"
            torchvision: "0.16.2+cpu"
            numpy: "numpy==1.26.4"
            scope: smoke
          # r7 R85-1: pyproject declares THREE python-conditioned torch
          # floors (>=2.1 for py<3.12, >=2.2 for py3.12, >=2.6 for py3.13)
          # but CI exercised only the first — the 3.12/3.13 claims were
          # asserted in metadata and executed nowhere. These two rows run
          # each conditioned floor on exactly the interpreter that declares
          # it.
          - track: floor
            python: "3.12"
            torch: "2.2.2+cpu"
            torchvision: "0.17.2+cpu"
            numpy: "numpy==1.26.4"
            scope: smoke
          - track: floor
            python: "3.13"
            torch: "2.6.0+cpu"
            torchvision: "0.21.0+cpu"
            transformers: "5.14.1"
            numpy: numpy
            scope: smoke
          - track: canonical
            python: "3.10"
            torch: "2.8.0+cpu"
            torchvision: "0.23.0+cpu"
            transformers: "5.14.1"
            numpy: numpy
            scope: smoke
          - track: canonical
            python: "3.11"
            torch: "2.8.0+cpu"
            torchvision: "0.23.0+cpu"
            transformers: "5.14.1"
            numpy: numpy
            scope: smoke
            # ONE gating row runs with pytest-randomly installed (grind r4,
            # reopened R76/3.16.4: the plugin was declared in the [test]
            # extra but no release-gating leg installed it, so the
            # order-isolation guards skipped on every PR and randomized-order
            # coverage existed only on scheduled legs). This row's smoke run
            # shuffles under a fresh seed each run -- the seed prints in the
            # pytest header for reproduction -- while the other five rows
            # stay definition-ordered.
            randomized: "1"
          - track: newest-admitted
            python: "3.10"
            torch: "2.13.0+cpu"
            torchvision: "0.28.0+cpu"
            transformers: "5.14.1"
            numpy: numpy
            scope: smoke
            # This row's environment matches the byte-oracle goldens' committed
            # ENV marker (tests/*/goldens/ENV), so it is the ONE leg where the
            # golden families enforce. The declaration turns every oracle skip
            # into a hard failure: a matrix bump here without a deliberate
            # golden rebaseline goes red instead of silently skipping all
            # golden cases (T13.1). Lockstep with the ENV markers is pinned by
            # tests/test_ci_packaging_gates.py.
            oracle_enforce: "1"
            # DOT-byte enforcement of the render-identity oracle runs here too:
            # the byte golden was recorded on this same py3.10 environment (the
            # byte compare is sensitive to py-minor qualname drift). The flag
            # previously sat on a row whose smoke selection never runs the
            # heavy-marked consumer test, so byte identity was enforced on NO
            # CI leg (T13.2); a dedicated step below executes it explicitly.
            render_byte_oracle: "1"
          - track: newest-admitted
            python: "3.11"
            torch: "2.13.0+cpu"
            torchvision: "0.28.0+cpu"
            transformers: "5.14.1"
            numpy: numpy
            scope: smoke
          - track: newest-admitted
            python: "3.12"
            torch: "2.13.0+cpu"
            torchvision: "0.28.0+cpu"
            transformers: "5.14.1"
            numpy: numpy
            scope: smoke
            # Python >= 3.12 is advertised support AND selects the
            # sys.monitoring escape-detection path, which no 3.10/3.11 row can
            # execute. Before this row existed the path had NO CI coverage and
            # its only >=3.12-gated unit test had rotted unnoticed (T13.4).
          - track: newest-admitted
            python: "3.13"
            torch: "2.13.0+cpu"
            torchvision: "0.28.0+cpu"
            transformers: "5.14.1"
            numpy: numpy
            scope: smoke
            # Python 3.13 was the last classifier-advertised interpreter with
            # ZERO test execution anywhere in CI — its only appearance was
            # nightly's resolution-only `uv pip compile` loop, which imports
            # nothing (grind r5, b10 R85-1). The classifier<->matrix lockstep
            # test in tests/test_ci_packaging_gates.py now requires a real
            # row per advertised interpreter, so dropping this row goes red.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install exact CPU test environment
        env:
          TORCH_VERSION: ${{ matrix.torch }}
          TORCHVISION_VERSION: ${{ matrix.torchvision }}
          NUMPY_SPEC: ${{ matrix.numpy }}
        run: |
          # --index-strategy unsafe-best-match rationale (R61, reviewed): both indexes are reputable and the torch pins are exact `==X+cpu` local versions only the torch index serves, so cross-index confusion cannot select a different name/version; first-index would break resolving torch's +cpu artifacts alongside PyPI deps.
          # The viz extra (matplotlib, torchshow, lovely-tensors) is installed
          # because tviz is shipped surface with smoke-marked render tests.
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,tabular,viz]" \
            "torch==${TORCH_VERSION}" \
            "torchvision==${TORCHVISION_VERSION}" \
            "${NUMPY_SPEC}" \
            "pydot==4.0.1" \
            "graphviz==0.21"

      - name: Install transformers for the R0 real-model sweep
        # Testing MEMO A4/A6 (lane P04): the R0 deep sweep (config-built real
        # upstream classes, zero network) is BLOCKING on every row whose torch
        # admits the pinned transformers (5.x floor is torch>=2.4). The three
        # torch<2.4 floor rows run without it -- gate R0_TRANSFORMERS_RUNTIME
        # in tests/real_model/r0/conftest.py names this split -- until the
        # HF_FLOOR version leg (B2) lands per-version expectations.
        if: matrix.transformers != ''
        run: uv pip install --system "transformers==${{ matrix.transformers }}"

      - name: Arm randomized test ordering (order-isolation gate row)
        if: matrix.randomized == '1'
        # Exact pin, matching the release-gating pin discipline; the [test]
        # extra declares the plugin unpinned for contributors, and the
        # scheduled .[test] legs resolve it freely.
        run: uv pip install --system "pytest-randomly==4.1.0"

      - name: Validate installed environment
        env:
          TORCH_VERSION: ${{ matrix.torch }}
          TORCHVISION_VERSION: ${{ matrix.torchvision }}
        run: |
          uv pip check
          python - <<'PY'
          import os

          import torch
          import torchvision
          from torchvision.ops import nms

          assert torch.__version__ == os.environ["TORCH_VERSION"]
          assert torchvision.__version__ == os.environ["TORCHVISION_VERSION"]
          boxes = torch.tensor([[0.0, 0.0, 1.0, 1.0]])
          scores = torch.tensor([1.0])
          assert nms(boxes, scores, 0.5).tolist() == [0]
          print(torch.__version__, torchvision.__version__)
          PY

      - name: Run smoke tests and compatibility coverage
        if: matrix.scope == 'smoke'
        env:
          TORCHLENS_ORACLE_ENFORCE: ${{ matrix.oracle_enforce }}
        run: |
          pytest tests/ -m smoke --tb=short -q \
            --junitxml="${{ runner.temp }}/smoke.junit.xml"
          pytest tests/test_torch_compat.py --tb=short -q

      - name: Fail on an under-executed smoke suite
        if: matrix.scope == 'smoke'
        # Executed-floor attestation on EVERY smoke row (previously only the
        # nightly preview-backend legs had one): a row where collection drift,
        # a conftest guard, or mass importorskip/oracle skipping hollows out
        # the suite must go red, not green. The smoke tier selects ~9,220
        # tests (re-trued 2026-09-01 to 4609 from 9218 collected, AUD-CODE 0.3:
        # the 2,830 literal sat at 30.7% of the live tier; before that,
        # 2026-08-26, megaplan D13: the 2,500 floor had lagged
        # the tier again, tolerating a silent 56% hollow-out against a comment
        # intending ~50% -- the same drift class as r7 R41's "~3900"/1900
        # pair); the floor is roughly half so normal churn and per-torch-
        # version skips never trip it, the 15% skip-fraction bound scales
        # with the selection, and tests/test_gate_infra_floor_drift.py now
        # RE-DERIVES the floor from the live selection count so this class
        # of drift goes red instead of waiting for the next audit.
        run: |
          python scripts/check_ci_executed_tests.py "${{ runner.temp }}/smoke.junit.xml" 4609 0.15

      - name: R0 real-model gate (blocking; PASSED-count attested)
        if: matrix.transformers != ''
        # Testing MEMO section 10 PR row: the 14-family R0 deep sweep --
        # structure, attn-impl facet diff, absence-claim adjudication, kwargs
        # identity, payload identity, pass-qualification pin, config
        # fingerprints -- at ZERO network bytes. The smoke selection above
        # already runs these (they are smoke-marked); this dedicated run is
        # the gate-shaped attestation: exact PASSED floor, so a skip cascade
        # or a fail-tolerant future refactor cannot hollow it out.
        # TORCHLENS_REQUIRE_R0 flips gate R0_TRANSFORMERS_RUNTIME fail-closed:
        # a broken transformers install on a CLAIMING row is red, never a skip.
        env:
          TORCHLENS_REQUIRE_R0: "1"
        run: |
          pytest tests/real_model/r0 -p no:randomly --tb=short -q \
            --junitxml="${{ runner.temp }}/r0.junit.xml"
          python scripts/check_ci_executed_tests.py "${{ runner.temp }}/r0.junit.xml" 0 --min-passed 71

      - name: Enforce the render byte oracle
        if: matrix.render_byte_oracle == '1'
        # The byte half of the render-identity oracle is heavy-marked, so the
        # smoke selection never executes it — the historical row-level env
        # flag was dead config and DOT-byte identity ran on NO CI leg (T13.2).
        # Run the consumer test explicitly on the recording-environment row
        # (measured ~6s) and attest that it EXECUTED rather than skipped.
        env:
          TORCHLENS_RENDER_BYTE_ORACLE: "1"
        run: |
          pytest tests/test_viz_render_identity_oracle.py -m heavy --tb=short -q \
            --junitxml="${{ runner.temp }}/render-byte-oracle.junit.xml"
          python scripts/check_ci_executed_tests.py \
            "${{ runner.temp }}/render-byte-oracle.junit.xml" 1

      - name: Enforce the surface byte oracle
        if: matrix.oracle_enforce == '1'
        # The surface-oracle BYTE family (6 per-axis byte tests + the
        # two-subprocess determinism control) is heavy-marked, so this row's
        # smoke selection collects only the 2 fact pins (probe: 2/9), and
        # every scheduled leg that selects heavy runs on a non-canonical
        # environment where require_env_golden legitimately skips — byte
        # identity was enforced on NO CI leg (the T13.2 class recurring one
        # family over, b10 R78 round-4). Run the family explicitly on the ONE
        # enforcing row and attest the byte tests EXECUTED (floor 6 = the six
        # model-axis byte tests; the determinism control also collects).
        env:
          TORCHLENS_ORACLE_ENFORCE: "1"
        run: |
          pytest tests/surface_oracle/ -m heavy --tb=short -q \
            --junitxml="${{ runner.temp }}/surface-byte-oracle.junit.xml"
          python scripts/check_ci_executed_tests.py \
            "${{ runner.temp }}/surface-byte-oracle.junit.xml" 6
