name: Latest Torch + HF Canary

# HF_LATEST_CANARY (testing MEMO D3/A6): daily UNPINNED latest torch,
# torchvision, transformers, and timm. Extends the historical torch-only
# canary with the R0 real-model sweep and the DistilGPT2 R1 core, each
# PASSED-count attested (executed counts are unsound on a non-blocking leg:
# failures count as executed). Non-blocking out-of-band only -- a red here
# never gates unrelated PRs; it feeds the canary-break protocol.

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  # Work branches named ci/** run the full workflow on push (and any branch
  # on manual dispatch) so GitHub's own runners test a branch before main.
  push:
    branches: ["ci/**"]

# Default-deny token scope (grind r3, R61/b2:D1): every job in this
# workflow only reads the repo, so the GITHUB_TOKEN gets exactly that.
permissions:
  contents: read

concurrency:
  group: latest-torch-canary
  cancel-in-progress: true

jobs:
  latest-canary:
    name: Latest Torch canary
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No uv.lock: key the uv cache on the dependency declarations.
          cache-dependency-glob: "pyproject.toml"

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install latest CPU test environment
        run: |
          # --index-strategy unsafe-best-match rationale (R61, reviewed): both indexes are reputable and the torch pins are exact `==X+cpu` local versions only the torch index serves, so cross-index confusion cannot select a different name/version; first-index would break resolving torch's +cpu artifacts alongside PyPI deps.
          # torchvision is floored so torch and torchvision resolve as a PAIR: on
          # a day the CPU index has a new torch before its matching torchvision,
          # an unfloored request backtracks torchvision to the ancient 0.2.0
          # (no torch pin, no torchvision.ops) instead of picking the newest
          # torch that has a matching torchvision. The validate step prints the
          # resolved pair.
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,tabular,viz]" \
            torch \
            "torchvision>=0.18" \
            transformers \
            timm \
            "pydot==4.0.1" \
            "graphviz==0.21"

      - name: Validate installed environment
        run: |
          uv pip check
          python - <<'PY'
          import timm
          import torch
          import torchvision
          import transformers
          from torchvision.ops import nms

          boxes = torch.tensor([[0.0, 0.0, 1.0, 1.0]])
          scores = torch.tensor([1.0])
          assert nms(boxes, scores, 0.5).tolist() == [0]
          print(
              "torch", torch.__version__,
              "torchvision", torchvision.__version__,
              "transformers", transformers.__version__,
              "timm", timm.__version__,
          )
          PY

      - name: Run smoke tests and compatibility coverage
        env:
          # One torch thread per xdist worker (see tests.yml smoke step).
          OMP_NUM_THREADS: "1"
        run: |
          pytest tests/ -m smoke -n 4 --tb=short -q \
            --junitxml="${{ runner.temp }}/canary-smoke.junit.xml"
          # `serial` tests run without xdist (see tests.yml smoke step).
          mapfile -t serial_files < <(grep -rlE --include="test_*.py" "mark\.serial" tests)
          pytest "${serial_files[@]}" -m "serial and not slow and not rare and not heavy" --tb=short -q
          pytest tests/test_torch_compat.py --tb=short -q

      - name: Fail on an under-executed canary suite
        # Same executed-floor attestation as every tests.yml smoke row: an
        # unattended leg where a new torch mass-skips or hollows collection
        # must go red, not green (grind r3, R82). Floor is roughly half the
        # ~1,420-test smoke selection (re-trued 2026-10-02 when the tier was cut
        # to a coverage-chosen subset); the
        # canary runs an UNADMITTED torch, so no skip-fraction bound — extra
        # per-version skips are exactly what it exists to surface loudly.
        run: |
          python scripts/check_ci_executed_tests.py "${{ runner.temp }}/canary-smoke.junit.xml" 710

      - name: R0 real-model sweep on latest transformers (PASSED-count attested)
        # Testing MEMO A6: the 14-family config-built sweep runs against the
        # UNPINNED latest transformers. A fingerprint/op-count/facet drift is
        # exactly what this leg exists to surface -- it fails the run and
        # feeds the canary-break triage, never a PR gate.
        run: |
          pytest tests/real_model/r0 -p no:randomly --tb=short -q \
            --junitxml="${{ runner.temp }}/canary-r0.junit.xml"
          python scripts/check_ci_executed_tests.py \
            "${{ runner.temp }}/canary-r0.junit.xml" 0 --min-passed 71

      - name: Restore the pinned artifact cache (exact key, no prefix fallback)
        id: artifact-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifact-cache
          key: ${{ hashFiles('tests/real_model/artifact_registry.jsonl') }}-canary-v1

      - name: Preflight-fetch the canary R1 arm (DistilGPT2 core)
        # The ONLY networked model step; every blob is sha256-verified, cache
        # hits are rehashed (verify-on-hit), and the byte cap is linted with
        # lstat. A missing artifact fails HERE, loudly -- never a test skip.
        run: |
          python scripts/preflight_fetch_artifacts.py fetch --venue canary --cache-dir .artifact-cache

      - name: DistilGPT2 R1 core, offline, exact-passed-ID floor
        run: |
          eval "$(python scripts/preflight_fetch_artifacts.py print-env --cache-dir .artifact-cache | sed 's/^/export /')"
          pytest tests/real_model/r1 -k distilgpt2 -p no:randomly --tb=short -q \
            --junitxml="${{ runner.temp }}/canary-r1.junit.xml"
          python scripts/check_ci_executed_tests.py \
            "${{ runner.temp }}/canary-r1.junit.xml" 0 --min-passed 1 \
            --passed-ids tests/real_model/r1/canary_passed_ids.txt
