name: Latest Torch Canary

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

# Default-deny token scope (grind r3, R61/b2:D1): every job in this
# workflow only reads the repo, so the GITHUB_TOKEN gets exactly that.
permissions:
  contents: read

concurrency:
  group: latest-torch-canary
  cancel-in-progress: true

jobs:
  latest-canary:
    name: Latest Torch canary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install latest CPU test environment
        run: |
          # --index-strategy unsafe-best-match rationale (R61, reviewed): both indexes are reputable and the torch pins are exact `==X+cpu` local versions only the torch index serves, so cross-index confusion cannot select a different name/version; first-index would break resolving torch's +cpu artifacts alongside PyPI deps.
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,tabular]" \
            torch \
            torchvision \
            "pydot==4.0.1" \
            "graphviz==0.21"

      - name: Validate installed environment
        run: |
          uv pip check
          python - <<'PY'
          import torch
          import torchvision
          from torchvision.ops import nms

          boxes = torch.tensor([[0.0, 0.0, 1.0, 1.0]])
          scores = torch.tensor([1.0])
          assert nms(boxes, scores, 0.5).tolist() == [0]
          print(torch.__version__, torchvision.__version__)
          PY

      - name: Run smoke tests and compatibility coverage
        run: |
          # Exclude the menagerie build subsystem from smoke, matching tests.yml:
          # tests/test_menagerie_*.py hard-imports pydantic (via
          # menagerie/schema.py) and tests/crawler/ is the crawler corpus -- both
          # absent from this .[dev,tabular] env (pydantic is only in .[test]).
          # This is a py3.11 leg, so it is past the tests/conftest.py < 3.11
          # auto-skip and needs these explicit --ignore flags to avoid a
          # collection ModuleNotFoundError. No smoke coverage is lost (no
          # menagerie or crawler test is smoke-marked).
          pytest tests/ -m smoke --ignore-glob="*menagerie*" --ignore=tests/crawler --tb=short -q \
            --junitxml="${{ runner.temp }}/canary-smoke.junit.xml"
          pytest tests/test_torch_compat.py --tb=short -q

      - name: Fail on an under-executed canary suite
        # Same executed-floor attestation as every tests.yml smoke row: an
        # unattended leg where a new torch mass-skips or hollows collection
        # must go red, not green (grind r3, R82). Floor is roughly half the
        # ~5,026-test smoke selection (re-trued 2026-08-16, r7 R41); the
        # canary runs an UNADMITTED torch, so no skip-fraction bound — extra
        # per-version skips are exactly what it exists to surface loudly.
        run: |
          python scripts/check_ci_executed_tests.py "${{ runner.temp }}/canary-smoke.junit.xml" 2500
