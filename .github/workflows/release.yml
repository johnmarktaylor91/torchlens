name: Release

# A release is cut by pushing a version tag (vX.Y.Z) that the maintainer
# creates by hand on a commit of main whose pyproject.toml and
# torchlens/__init__.py already carry that version. Nothing in CI computes,
# bumps or commits a version: the tag is the only trigger that publishes.
# Pull requests to main run the same build as a dry run (no token, no
# upload), so a broken build or lock is caught before a tag is ever pushed.
on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  gates:
    # The tag commit must pass the pull-request gates again before upload.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/pr.yml

  build:
    name: Build reproducible artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install the hash-locked builder
        # build and its setuptools backend come only from the hash-verified
        # lock, wheels only, so no unpinned package code runs at build time.
        run: >
          pip install --require-hashes --only-binary :all:
          -r .github/workflows/release-requirements.txt

      - name: Refuse a tag that does not match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["TAG"].removeprefix("v")
          toml_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          init_text = Path("torchlens/__init__.py").read_text()
          init_version = re.search(r'^__version__ = "([^"]+)"', init_text, re.M).group(1)
          print(f"tag {tag}, pyproject {toml_version}, __init__ {init_version}")
          if not tag == toml_version == init_version:
              raise SystemExit("tag, pyproject.toml and torchlens/__init__.py disagree; refusing to publish")
          PY
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "tag ${TAG} is not on main; refusing to publish"
            exit 1
          }

      - name: Build wheel and sdist
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)" python -m build --no-isolation
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)" \
            python scripts/normalize_sdist.py dist/*.tar.gz dist/*.whl
          ls -l dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI and GitHub Releases
    needs: [gates, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      # PyPI trusted publishing (OIDC, no API token). PyPA documents its own
      # publish action by tag; this is pinned to the v1.14.2 commit.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag --generate-notes
