# Intentionally incompatible combinations. Found by resolving every pair of
# the user-facing and heavy extras with `uv pip compile` on python 3.10 and
# 3.11 (Linux x86_64); every pair below failed on both interpreters except
# neuro + brainscore, which pyproject.toml names.
#
# expect = "install_fails": the resolver refuses the combination.
# expect = "install_or_refuse": either the resolver refuses it, or it installs
# and every gate in `refuses` raises its typed MissingDependencyError and every
# module in `import_fails` raises ImportError on import.

# neuro + brainscore: named in pyproject.toml's neuro comment and
# docs/reference/neuro.md (brainscore_vision pins scikit-learn<1.6, rsatoolbox
# 0.3.x needs scikit-learn>=1.6). The documented outcome: the pair resolves
# (rsatoolbox 0.3.2 with scikit-learn 1.5.2, measured) and `import rsatoolbox`
# fails. Below 3.11 the brainscore extra is empty, so the pair runs on 3.11.
[sets.neuro-brainscore]
extras = ["neuro", "brainscore"]
python = "3.11"
expect = "install_or_refuse"
import_fails = ["rsatoolbox"]
group = "pr"

# sae-lens>=6.45 and inseq>=0.6 have no common transformers band.
[sets.sae-inseq]
extras = ["sae", "inseq"]
expect = "install_fails"
group = "pr"

# `all` carries inseq, so it inherits the sae + inseq conflict.
[sets.all-sae]
extras = ["all", "sae"]
expect = "install_fails"
group = "pr"

# tlens-oracle is a test-only extra (transformer-lens==3.8.0); its conflicts
# are with the extras whose transformers or sentence-transformers bands
# exclude transformers 5.x.
[sets.all-tlens-oracle]
extras = ["all", "tlens-oracle"]
expect = "install_fails"
group = "extended"

[sets.tlens-oracle-inseq]
extras = ["tlens-oracle", "inseq"]
expect = "install_fails"
group = "extended"

[sets.tlens-oracle-dialz]
extras = ["tlens-oracle", "dialz"]
expect = "install_fails"
group = "extended"

[sets.tlens-oracle-steering]
extras = ["tlens-oracle", "steering"]
expect = "install_fails"
group = "extended"

[sets.tlens-oracle-compat-shims]
extras = ["tlens-oracle", "compat-shims"]
expect = "install_fails"
group = "extended"
