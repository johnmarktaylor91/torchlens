# The one reviewed input for the clean-environment packaging tests.
#
# tools/packaging/generate_constraints.py turns this file into
# tools/packaging/constraints/<set>.txt (sorted, no timestamps) and into the CI
# matrix of the `packaging` leg in .github/workflows/pr.yml; `--check` exits 1
# when a generated file is stale. tests/packaging_install/ installs the built wheel and
# sdist into a fresh venv per set under that set's constraints and probes it.
#
# Every extra declared in pyproject.toml must appear in a set or in `aliases`;
# the generator refuses the file otherwise, so a new extra cannot be forgotten.

schema = 1

[defaults]
python = "3.10"
# The pinned environment's torch, served CPU-only by the PyTorch index.
index_url = "https://download.pytorch.org/whl/cpu"
extra_index_url = "https://pypi.org/simple"

[constraints]
# Applied to every set.
common = ["torch==2.13.0+cpu"]

# Per-set pins beyond `common`, keyed by extra. Each pin here is one CI already
# holds exact elsewhere (pyproject.toml comments name them).
[constraints.extra]
netron = ["netron==9.2.2"]
model-explorer = ["ai-edge-model-explorer==0.1.33"]

[aliases]
# Spellings that request exactly another extra (pyproject.toml rolls them up
# with a self-reference), so the aliased extra's set covers them.
all-stretch = "all"
tensorflow = "tf"

# Typed refusals asserted per set. A gate is expected PRESENT when its extra is
# in the set (and the interpreter meets `python_min`), ABSENT otherwise. Absent:
# the access raises torchlens.errors.MissingDependencyError with fields["code"]
# equal to `code` (and fields["dependency"] equal to `dependency` when given).
# Present: `module` imports and the access resolves (`present = "import"` checks
# only the import, for entry points that need real arguments).
[gates.neuro]
extra = "neuro"
access = "torchlens.neuro:rdms"
code = "facade_dependency_missing"
dependency = "rsatoolbox"
module = "rsatoolbox"

[gates.brainscore]
extra = "brainscore"
access = "torchlens.neuro:activations_extractor"
code = "facade_dependency_missing"
dependency = "brainscore_vision"
module = "brainscore_vision"
# The extra is empty below 3.11 (brainscore_vision requires >=3.11).
python_min = "3.11"

[gates.treescope]
extra = "treescope"
call = "torchlens.bridge.treescope:register"
cleanup = "torchlens.bridge.treescope:unregister"
code = "treescope_bridge_unavailable"
module = "treescope"

[gates.lit]
extra = "lit"
call = "torchlens.bridge.lit:dataset"
call_args = [[]]
code = "lit_dependency_missing"
module = "lit_nlp"
present = "import"

# Sets. `group = "pr"` runs on every pull request; `group = "extended"` runs on
# manual dispatch and workflow_call. `expect` is "install" (installs and every
# probe passes); the incompatible sets at the end use the two other values.
[sets.none]
extras = []
group = "pr"

[sets.all]
# `all` is pyproject's "everything that installs together" rollup. inseq
# requires treescope, so the treescope gate resolves here too (measured).
extras = ["all"]
present_gates = ["treescope"]
group = "pr"

[sets.neuro]
extras = ["neuro"]
group = "pr"

[sets.tabular]
extras = ["tabular"]
group = "pr"

[sets.viz]
extras = ["viz"]
