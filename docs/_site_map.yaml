# Site map of the documentation: every page under docs/ appears once.
#
# section     where the page sits in the site map (ids below; order = navigation order)
# publish     true when the page is in the built site now; the rest are excluded
# group       optional sub-heading inside the section
# moved_from  old docs-relative paths; published pages get a redirect from each
# move_to     proposed physical location (not moved yet)
# note        why a page sits where it does
#
# tools/docs/site_nav.py renders the navigation, exclusions and redirects in
# mkdocs.yml from this file; `python tools/docs/site_nav.py --check` fails on drift.
# Section titles live only here. "Field guide" is pencilled in: the fallback
# "Techniques" is a one-line change to its title below.
