# Documentation site. Sources are Markdown under docs/; the build tool reads this
# file. The nav, exclude_docs and redirect blocks are generated from
# docs/_site_map.yaml by tools/docs/site_nav.py: edit the site map, not the blocks.
site_name: TorchLens
site_url: https://johnmarktaylor91.github.io/torchlens/
site_description: Capture, inspect and edit every operation of a PyTorch model.
repo_url: https://github.com/johnmarktaylor91/torchlens
repo_name: johnmarktaylor91/torchlens
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

plugins:
  - search
  - redirects:
      redirect_maps:
        # <generated:redirects>
        recipes/seeded_subsample.md: field-guide/seeded_subsample.md
        # </generated:redirects>
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: false
            show_submodules: false
            members_order: source
            filters: ["!^_"]
            show_signature_annotations: true
            separate_signature: true

extra:
  version:
    provider: mike
    default: latest

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

