# Documentation site. Sources are Markdown under docs/; the build tool reads this
# file. The nav, exclude_docs and redirect blocks are generated from
# docs/_site_map.yaml by tools/docs/site_nav.py: edit the site map, not the blocks.
site_name: TorchLens
site_url: https://johnmarktaylor91.github.io/torchlens/
site_description: Capture, inspect and edit every operation of a PyTorch model.
repo_url: https://github.com/johnmarktaylor91/torchlens
repo_name: johnmarktaylor91/torchlens
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

plugins:
  - search
  - redirects:
      redirect_maps:
        # <generated:redirects>
        recipes/acdc_ioi.md: field-guide/acdc_ioi.md
        recipes/conditional_steering.md: field-guide/conditional_steering.md
        recipes/dissection.md: field-guide/dissection.md
        recipes/feature_visualisation.md: field-guide/feature_visualisation.md
        recipes/generation_step_attribution.md: field-guide/generation_step_attribution.md
        recipes/jacobian_lens.md: field-guide/jacobian_lens.md
        recipes/lrp_epsilon_litmus.md: field-guide/lrp_epsilon_litmus.md
        recipes/lrp_transformers_lxt.md: field-guide/lrp_transformers_lxt.md
        recipes/pretrained_saes.md: field-guide/pretrained_saes.md
        recipes/prisma_clip_sae.md: field-guide/prisma_clip_sae.md
        recipes/quantus.md: field-guide/quantus.md
        recipes/sae_crosscoder_diff.md: field-guide/sae_crosscoder_diff.md
        recipes/sae_latent_export.md: field-guide/sae_latent_export.md
        recipes/sae_trainers.md: field-guide/sae_trainers.md
        recipes/seeded_subsample.md: field-guide/seeded_subsample.md
        recipes/tcav.md: field-guide/tcav.md
        recipes/torchcam.md: field-guide/torchcam.md
        recipes/trainable_backbone.md: field-guide/trainable_backbone.md
        recipes/training_ribbon.md: field-guide/training_ribbon.md
        recipes/tuned_lens.md: field-guide/tuned_lens.md
        recipes/weightwatcher.md: field-guide/weightwatcher.md
        migration/captum.md: migration/from_captum.md
        migration/nnsight.md: migration/from_nnsight.md
        migration/pyvene.md: migration/from_pyvene.md
        migration/transformerlens.md: migration/from_transformerlens.md
        # </generated:redirects>
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: false
            show_submodules: false
            members_order: source
            filters: ["!^_"]
            show_signature_annotations: true
            separate_signature: true

extra:
  version:
    provider: mike
    default: latest

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

