# conda-forge recipe for torchlens (v1 recipe format, built with rattler-build).
# This is the canonical copy; see packaging/conda/README.md for how it maps to
# a conda-forge staged-recipes submission and how it is kept in sync with
# pyproject.toml (tests/test_conda_recipe_sync.py fails on drift).
schema_version: 1

context:
  name: torchlens
  version: "3.0.3"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[:1] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: b955fc057fc4a03f0c1934f25b4d5c26d8d6dde5cb299147ccfc09d13750fabd

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=83
  run:
    - python >=${{ python_min }}
    - numpy >=1.26.4
    - packaging >=23.2
    - pytorch >=2.1
    - safetensors >=0.4
    - tqdm >=4.66
    - python-graphviz >=0.20.1
    - typing_extensions >=4.0
    - pillow >=9

tests:
  - python:
      imports:
        - torchlens
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      - python -c "import torch, torchlens as tl; m = torch.nn.Sequential(torch.nn.Linear(4, 8), torch.nn.ReLU(), torch.nn.Linear(8, 2)); t = tl.trace(m, torch.randn(3, 4)); assert isinstance(t, tl.Trace), type(t)"

about:
  homepage: https://github.com/johnmarktaylor91/torchlens
  repository: https://github.com/johnmarktaylor91/torchlens
  license: Apache-2.0
  license_file: LICENSE
  summary: Extract activations and metadata from PyTorch models and save portable bundles.
  description: |
    TorchLens logs the operations of a PyTorch model's forward pass into Trace,
    Layer and Op objects: run a normal forward pass, record operation metadata
    and activations, then inspect, visualize, validate or save the result.

extra:
  recipe-maintainers:
    - johnmarktaylor91
