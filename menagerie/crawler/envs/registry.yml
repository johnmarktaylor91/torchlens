    "graph": {"phase": "pytorch", "framework": "pytorch", "description": "Graph, molecular, geometric, and scientific PyTorch stack.", "split_guidance": "Separate DGL from PyG only if target solving proves they cannot coexist; an osx-arm64 solve shows dgl 2.3.0 and pyg 2.6.1 do coexist, so keep them together. This intent must stay separate from core: conda-forge dgl pins pytorch >=2.3.1,<2.3.2 CPU-only and depends on tensorflow, so folding it into core would downgrade pytorch 2.13 -> 2.3.1, torchvision 0.28 -> 0.18.1, numpy 2.5.1 -> 1.26.4 and add the whole TensorFlow 2.17 stack for every core model. dgl 1.1.3, the last PyPI release with non-Windows wheels, is strictly worse here: it caps pytorch below 2.2 and is unsatisfiable against the core floor."},
