[workspace]
name = "torchlens-menagerie-geom_sci"
channels = ["conda-forge"]
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
"python" = "3.11.*"
"pip" = "*"

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu121"]
index-strategy = "unsafe-best-match"

[pypi-dependencies]
"graphviz" = "*"
"safetensors" = ">=0.4"
"tqdm" = "*"
"typing_extensions" = ">=4.0"
"pillow" = ">=9"
"torch" = "==2.4.1"
"torchvision" = "==0.19.1"
"numpy" = ">=2.0,<2.2"
"nequip" = "*"
"gvp" = "*"
"s2cnn" = "*"
"schnetpack" = "==2.1.1"
