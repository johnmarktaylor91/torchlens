schema_version: 1
pixi:
  installed_version: "0.70.2"
  install_method: "conda create -p /tmp/tlpixi -c conda-forge pixi -y"
  managed_cache_root: "~/.cache/torchlens/menagerie/envs"
  disk_free_reserve_gib: 25
assignment:
  invariant: "Every catalog row is assigned to exactly one island; base-capable rows assign to base."
  empirical_manifest: "/tmp/menagerie_base_sweep/manifest.tsv"
  dependency_unavailable_status: "skipped:dependency_unavailable"
  base_modules:
    - builtins
    - menagerie
    - pathlib
    - torch
  cluster_envs:
    audioseal: audio
    cnn: misc
    espnet2: audio
    gvp: geom_sci
    lerobot+torch: gpu_tail
    miscc: misc
    miscc+torch: misc
    mmdet+mmengine: mmlab_core
    mmengine+mmsegmentation: mmlab_core
    mmocr: mmocr
    nemo: audio
    nequip+torch: geom_sci
    neuralforecast+torch: forecast_tab
    pytorch_widedeep: forecast_tab
    s2cnn: geom_sci
    schnetpack+torch: geom_sci
    sgmse: audio
    siamrpn: misc
    sonata: misc
    spikingtorch: snn
    super_gradients: yolox_sg
    tinycudann: gpu_tail
    yolox: yolox_sg
  fallback_dependency_env: gpu_tail
islands:
  base:
    description: "Current editable TorchLens environment for dependency-free and base PyTorch rows."
    selectors:
      catch_all_base: true
    python: "3.11"
    torch_pin: "current"
    packages:
      conda:
        - "python=3.11"
        - pip
      pypi: []
    smoke_stable_ids:
      - m2
      - m10
    expected_device: cpu
    disk_estimate_gib: 0
    status_policy:
      default_status: passed
      unavailable_status: env_unavailable
      failure_status: failed
  mmlab_core:
    description: "OpenMMLab detection, segmentation, and pretrain stack without pose/OCR caps."
    selectors:
      cluster_patterns:
        - "^mmdet\\+mmengine$"
        - "^mmengine$"
        - "^mmengine\\+mmsegmentation$"
      module_patterns:
        - "^mmdet$"
        - "^mmcv$"
        - "^mmengine$"
        - "^mmseg$"
        - "^mmpretrain$"
      zoo_patterns:
        - "mmdet"
        - "mmdetection"
        - "mmseg"
        - "mmsegmentation"
        - "mmpretrain"
        - "mmcls"
        - "open-mmlab"
        - "openmmlab"
      exclude_zoo_patterns:
        - "mmpose"
        - "mmocr"
        - "mmagic"
      exclude_module_patterns:
        - "^mmpose$"
        - "^mmocr$"
    python: "3.11"
    torch_pin: "torch==2.1.0+cu121 torchvision==0.16.0+cu121"
    torch_index_url: "https://download.pytorch.org/whl/cu121"
    pypi_options:
      extra_index_urls:
        - "https://download.pytorch.org/whl/cu121"
      find_links:
        - "https://download.openmmlab.com/mmcv/dist/cu121/torch2.1/index.html"
      no_build_isolation:
        - mmcv
    packages:
      conda:
        - "python=3.11"
        - pip
      pypi:
        - "torch==2.1.0+cu121"
        - "torchvision==0.16.0+cu121"
        - "numpy<2"
        - openmim
        - ftfy
        - regex
        - xtcocotools
        - munkres
        - "mmengine==0.10.7"
        - "mmcv==2.1.0"
        - "mmdet==3.3.0"
        - "mmsegmentation==1.2.2"
        - "mmpretrain==1.2.0"
    smoke_stable_ids:
      - m6375
      - m7069
    expected_device: cpu
    disk_estimate_gib: 8
    status_policy:
      default_status: env_unavailable
      unavailable_status: env_unavailable
      failure_status: install_failed
      notes: "Legacy conda recipe was empirically working, but pixi lock/build is still unproven."
  mmpose:
    description: "OpenMMLab pose island with mmpose-specific dependency caps."
    selectors:
      cluster_patterns:
        - "^mmpose"
      module_patterns:
        - "^mmpose$"
      zoo_patterns:
        - "mmpose"
      name_patterns:
