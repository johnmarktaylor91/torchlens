        - regex
        - xtcocotools
        - munkres
        - "mmengine==0.10.7"
        - "mmcv==2.1.0"
        - "mmdet==3.2.0"
        - "mmpose==1.3.2"
    smoke_stable_ids:
      - m6875
    expected_device: cpu
    disk_estimate_gib: 9
    status_policy:
      default_status: env_unavailable
      unavailable_status: env_unavailable
      failure_status: install_failed
  mmocr:
    description: "OpenMMLab OCR island pinned separately from current mmdet/mmseg caps."
    selectors:
      cluster_patterns:
        - "^mmocr"
      module_patterns:
